<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Golf — ASR &amp; Closer Report Dashboard</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --orange:#FD3300;
    --dark-orange:#DB2C00;
    --black:#1D1A1A;
    --panel:#2A2A2A;
    --gray:#7B726C;
    --light-gray:#DFD9D5;
    --white:#FFFFFF;
    --line:#333;
    --good:#4CAF50;
    --warn:#eda100;
    --bad:#e34948;
    /* categorical series — PG orange holds slot 2 of the validated 8-hue order, rest untouched */
    --s-blue:#3987e5;
    --s-orange:#FD3300;
    --s-aqua:#199e70;
    --s-yellow:#c98500;
    --s-magenta:#d55181;
    --s-violet:#9085e9;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--black);
    color:var(--white);
    padding:20px;
  }

  .header{
    background:linear-gradient(135deg, var(--black) 0%, rgba(253,51,0,0.12) 100%);
    border-bottom:3px solid var(--orange);
    padding:26px 30px;
    margin-bottom:22px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  .header h1{ font-size:28px; color:var(--orange); margin-bottom:6px; }
  .header p{ font-size:13px; color:var(--gray); text-transform:uppercase; letter-spacing:1px; }
  .header .asof{ font-size:12px; color:var(--light-gray); text-align:right; }
  .header .asof b{ color:var(--white); }

  .filters{
    background:var(--panel);
    border:1px solid var(--line);
    padding:18px 20px;
    margin-bottom:18px;
    border-radius:8px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .date-row, .dim-row{ display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; }
  .filter-group{ display:flex; flex-direction:column; gap:6px; min-width:150px; }
  .filter-group.grow{ flex:1; min-width:220px; }
  .filter-group label{ font-size:11px; color:var(--gray); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
  .filter-group select, .filter-group input[type=date]{
    padding:10px 12px; background:#F4F2F0; border:1px solid var(--light-gray);
    border-radius:4px; color:var(--black); font-size:13px; font-family:inherit;
  }
  .presets{ display:flex; gap:6px; flex-wrap:wrap; }
  .preset-btn{
    padding:8px 12px; background:transparent; border:1px solid var(--light-gray);
    color:var(--light-gray); border-radius:4px; font-size:12px; cursor:pointer; font-weight:600;
  }
  .preset-btn:hover, .preset-btn.active{ background:var(--orange); border-color:var(--orange); color:var(--white); }
  .reset-btn{
    padding:10px 16px; background:transparent; border:1px solid var(--orange); color:var(--orange);
    border-radius:4px; font-size:12px; font-weight:700; cursor:pointer; text-transform:uppercase;
  }
  .reset-btn:hover{ background:var(--orange); color:var(--white); }
  .gran-note{ font-size:11px; color:var(--gray); margin-top:4px; }

  .tabs{
    display:flex; gap:4px; margin-bottom:20px; border-bottom:2px solid var(--line);
    overflow-x:auto; padding-bottom:1px;
  }
  .tab{
    padding:11px 18px; background:transparent; border:none; color:var(--gray); cursor:pointer;
    font-size:13px; font-weight:600; white-space:nowrap; border-bottom:3px solid transparent; transition:all .2s;
  }
  .tab.active{ color:var(--orange); border-bottom-color:var(--orange); }
  .tab:hover{ color:var(--white); }

  .tab-content{ display:none; }
  .tab-content.active{ display:block; }

  .section-title{ font-size:14px; color:var(--light-gray); text-transform:uppercase; letter-spacing:0.5px; margin:26px 0 12px; font-weight:700; }
  .note{ font-size:11px; color:var(--gray); margin-bottom:14px; font-style:italic; }

  .metrics-container{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:10px; }
  .metric{ background:linear-gradient(135deg,var(--panel) 0%,var(--black) 100%); border:1px solid var(--line);
    padding:20px; border-radius:8px; border-left:4px solid var(--orange); }
  .metric-label{ font-size:11px; color:var(--gray); text-transform:uppercase; letter-spacing:1px; font-weight:700; margin-bottom:10px; }
  .metric-value{ font-size:32px; font-weight:700; color:var(--orange); line-height:1; font-variant-numeric:tabular-nums; }
  .metric-sub{ font-size:11px; color:var(--gray); margin-top:6px; }

  .chart-card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px; margin-top:18px; }
  .chart-card h3{ font-size:13px; color:var(--light-gray); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
  .legend{ display:flex; gap:14px; font-size:11px; color:var(--gray); margin:6px 0 10px; flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; }

  .table-section{ background:linear-gradient(135deg,var(--panel) 0%,var(--black) 100%);
    border:1px solid var(--line); border-radius:8px; overflow:auto; margin-top:18px; max-height:560px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead{ background:#3a3a3a; border-bottom:2px solid var(--orange); position:sticky; top:0; z-index:1; }
  th{ padding:11px 12px; text-align:left; color:var(--white); font-weight:700; text-transform:uppercase; font-size:10.5px; letter-spacing:.4px; white-space:nowrap;
      cursor:pointer; user-select:none; }
  th:hover{ color:var(--orange); }
  th.sorted::after{ content:' ▾'; color:var(--orange); }
  td{ padding:9px 12px; border-bottom:1px solid var(--line); color:var(--white); white-space:nowrap; font-variant-numeric:tabular-nums; }
  tbody tr:hover{ background:rgba(253,51,0,0.07); }
  tbody tr.subtotal{ background:rgba(253,51,0,0.10); font-weight:700; }
  .no-data{ text-align:center; padding:40px 20px; color:var(--gray); }
  .pill{ padding:2px 8px; border-radius:10px; font-size:10.5px; font-weight:700; }
  .pill.good{ background:rgba(76,175,80,.18); color:var(--good); }
  .pill.bad{ background:rgba(227,73,72,.18); color:var(--bad); }

  .update-time{ text-align:right; font-size:11px; color:var(--gray); padding:14px 4px 4px; }
</style>
</head>

// Timezone-safe YYYY-MM-DD formatter. `d` is always constructed as LOCAL midnight in this file
// (e.g. `new Date(y, m, 1)`), so formatting via toISOString() (which converts to UTC first) would
// silently roll the date back by one day for any viewer east of UTC — this reads the same local
// fields the Date was built from instead.
function dstr(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function inRange(dateStr){
  return dateStr >= state.start && dateStr <= state.end;
}

// pick finest granularity that has data in range
function addDaysStr(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return dstr(d);
}
function endOfMonthStr(monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  const d = new Date(y, m, 0); // day 0 of next month = last day of this month
  return dstr(d);
}
// Only the START of the selection has to fall inside a granularity's real coverage window.
// The END is deliberately not checked against the window's upper bound: the most recent
// day/week is always going to trail "today" by design (the sheet itself lags by ~1 day
// before a period is fully tallied), so requiring the END to fit too would kick almost any
// range ending "today" straight to the coarsest granularity, even when the START is well
// within daily or weekly coverage.
function fitsWindow(min, max){
  return state.start >= min && state.start <= max;
}

// Picks the FINEST granularity whose real data window fully covers the selected range —
// e.g. picking a range that spans more than the ~10 rolling daily columns falls back to
// Weekly, and a range spanning more than the Weekly window falls back to Monthly, instead
// of silently summing only the days/weeks that happen to overlap (which under-counts and
// makes different ranges look identical).
// chartRows is deliberately NOT range-filtered the same way as rows/KPIs: a chart with a single
// point reads as broken, so it always shows the fullest real trend window for the active
// granularity (last ~30 days when daily, all 6 weeks when weekly, all 3 months when monthly) —
// while the KPI tiles/table above stay exact to the selected date range.
function trendForRange(){
  const dailyMin = TREND_DAILY[0].date, dailyMax = TREND_DAILY[TREND_DAILY.length-1].date;
  const weeklyMin = TREND_WEEKLY[0].weekBeginning, weeklyMax = addDaysStr(TREND_WEEKLY[TREND_WEEKLY.length-1].weekBeginning, 6);
  const monthlyMin = TREND_MONTHLY[0].month+'-01', monthlyMax = endOfMonthStr(TREND_MONTHLY[TREND_MONTHLY.length-1].month);

  if (fitsWindow(dailyMin, dailyMax)) {
    return {gran:'daily', rows: TREND_DAILY.filter(r=>inRange(r.date)), chartRows: TREND_DAILY.slice(-30), label:r=>r.date.slice(5)};
  }
  if (fitsWindow(weeklyMin, weeklyMax)) {
    const rows = TREND_WEEKLY.filter(r => r.weekBeginning <= state.end && addDaysStr(r.weekBeginning,6) >= state.start);
    return {gran:'weekly', rows, chartRows: TREND_WEEKLY.slice(), label:r=>'WB '+r.weekBeginning.slice(5)};
  }
  const rows = TREND_MONTHLY.filter(r => (r.month+'-01') <= state.end && endOfMonthStr(r.month) >= state.start);
  return {gran:'monthly', rows: rows.length?rows:TREND_MONTHLY, chartRows: TREND_MONTHLY.slice(-3), label:r=>r.month};
}

function closerTrendForRange(){

  const weeklyMin = CLOSER_TREND_WEEKLY[0].weekBeginning, weeklyMax = addDaysStr(CLOSER_TREND_WEEKLY[CLOSER_TREND_WEEKLY.length-1].weekBeginning, 6);
  const monthlyMin = CLOSER_TREND_MONTHLY[0].month+'-01', monthlyMax = endOfMonthStr(CLOSER_TREND_MONTHLY[CLOSER_TREND_MONTHLY.length-1].month);

    return {gran:'weekly', rows, chartRows: CLOSER_TREND_WEEKLY.slice(), label:r=>'WB '+r.weekBeginning.slice(5)};

// ---------------- SVG line chart ----------------
function lineChart(containerId, rows, series, xLabelFn){
  const el = document.getElementById(containerId);
  if(!rows.length){ el.innerHTML = '<div class="no-data">No data in this range</div>'; return; }
  const W = el.clientWidth || 760, H = 220, padL=46, padR=16, padT=14, padB=28;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const n = rows.length;
  const xStep = n>1 ? plotW/(n-1) : 0;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible">`;

  // gridlines
  const maxVal = Math.max(...series.map(s=>Math.max(...rows.map(r=>r[s.key]||0)))) || 1;
  const niceMax = maxVal * 1.15;
  for(let g=0; g<=4; g++){
    const y = padT + plotH - (g/4)*plotH;
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#383835" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+3}" font-size="9" fill="#898781" text-anchor="end">${fmtInt(niceMax*g/4)}</text>`;
  }
  // x labels (sparse)
  rows.forEach((r,i)=>{
    if(n<=10 || i%Math.ceil(n/8)===0 || i===n-1){
      const x = padL + i*xStep;
      svg += `<text x="${x}" y="${H-8}" font-size="9" fill="#898781" text-anchor="middle">${xLabelFn(r)}</text>`;
    }
  });

  series.forEach((s,si)=>{
    const color = s.color;
    let pts = rows.map((r,i)=>{
      const x = padL + i*xStep;
      const y = padT + plotH - ((r[s.key]||0)/niceMax)*plotH;
      return [x,y];
    });
    const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    svg += `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>{
      svg += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${color}" stroke="#1D1A1A" stroke-width="1">`;
      svg += `<title>${xLabelFn(rows[i])} · ${s.name}: ${s.fmt ? s.fmt(rows[i][s.key]) : fmtInt(rows[i][s.key])}</title></circle>`;
    });
  });
  svg += `</svg>`;
  el.innerHTML = svg;
}

function barChart(containerId, rows, key, nameFn, color, fmt){
  const el = document.getElementById(containerId);
  if(!rows.length){ el.innerHTML = '<div class="no-data">No data</div>'; return; }
  const W = el.clientWidth || 760;
  const rowH = 22, gap=6, padL=140, padR=60, padT=6;
  const H = rows.length*(rowH+gap)+padT;
  const maxVal = Math.max(...rows.map(r=>r[key]||0)) || 1;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">`;
  rows.forEach((r,i)=>{
    const y = padT + i*(rowH+gap);
    const w = ((r[key]||0)/maxVal) * (W-padL-padR);
    svg += `<text x="${padL-8}" y="${y+rowH*0.68}" font-size="11" fill="#c3c2b7" text-anchor="end">${nameFn(r)}</text>`;
    svg += `<rect x="${padL}" y="${y}" width="${Math.max(w,2)}" height="${rowH}" rx="4" fill="${color}">
              <title>${nameFn(r)}: ${fmt?fmt(r[key]):fmtInt(r[key])}</title></rect>`;
    svg += `<text x="${padL+w+8}" y="${y+rowH*0.68}" font-size="11" fill="#ffffff">${fmt?fmt(r[key]):fmtInt(r[key])}</text>`;
  });
  svg += `</svg>`;
  el.innerHTML = svg;
}

// ---------------- sortable table ----------------
function renderTable(tableId, rows, cols, opts){
  opts = opts || {};
  const tbody = document.getElementById(tableId+'-body');
  const thead = document.getElementById(tableId+'-head');
  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="${cols.length}" class="no-data">No rows match the current filters</td></tr>`; }
  const st = sortState[tableId];
  let sorted = rows.slice();
  if(st){
    sorted.sort((a,b)=>{
      const va=a[st.col], vb=b[st.col];
      if(typeof va==='string') return st.dir*va.localeCompare(vb);
      return st.dir*((va||0)-(vb||0));
    });
  }
  thead.innerHTML = '<tr>' + cols.map(c=>`<th data-col="${c.key}" class="${st&&st.col===c.key?'sorted':''}">${c.label}</th>`).join('') + '</tr>';
  thead.querySelectorAll('th').forEach(th=>{
    th.addEventListener('click', ()=>{
      const col = th.dataset.col;
      const cur = sortState[tableId];
      sortState[tableId] = { col, dir: (cur && cur.col===col) ? -cur.dir : -1 };
      renderTable(tableId, rows, cols, opts);
    });
  });
  tbody.innerHTML = sorted.map(r=>{
    const cls = opts.rowClass ? opts.rowClass(r) : '';
    return `<tr class="${cls}">` + cols.map(c=> `<td>${c.fmt ? c.fmt(r[c.key], r) : (r[c.key] ?? '')}</td>`).join('') + '</tr>';
  }).join('');
}

// ---------------- panel builders ----------------
function kpiTile(label, value, sub){
  return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div>${sub?`<div class="metric-sub">${sub}</div>`:''}</div>`;
}

function buildPanels(){
  const wrap = document.getElementById('panels');
  wrap.innerHTML = TABS.map((t,i)=>`<div class="tab-content${i===0?' active':''}" id="panel-${i}"></div>`).join('');
}

function buildTabBar(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = TABS.map((t,i)=>`<button class="tab ${i===0?'active':''}" data-i="${i}">${t}</button>`).join('');
  bar.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      bar.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(p=>p.classList.remove('active'));
      document.getElementById('panel-'+btn.dataset.i).classList.add('active');
    });
  });
}

function renderAll(){
  const t = trendForRange();
  document.getElementById('granNote').textContent =
    `Showing ${t.gran} granularity for ${state.start} → ${state.end}` +
    (t.gran!=='daily' ? ' — the source sheet only keeps ~10 rolling daily columns before rolling up into weekly / monthly buckets, so this recreation follows the same behavior.' : '.');
  document.getElementById('renderTime').textContent = new Date().toLocaleString();

  renderExecSummary(t);
  renderASRTrend(t);
  renderCloserTrend();
  renderClosersMetric();
  renderRepPerMetric();
  renderASRDailyMetric();
  renderCallSourceBR();
  renderNoShows();
  renderBlankDidShow();
}

// full 23-metric column set, shared by Executive Summary Trend & ASR Trend View team tables
function fullMetricCols(periodKey, periodLabel){
  return [
    {key:periodKey, label:periodLabel},
    {key:'sets', label:'Sets'}, {key:'ibSets', label:'IB Sets'}, {key:'obSets', label:'OB Sets'},
    {key:'appt', label:'Appointments'},
    {key:'warmT', label:'Warm Transfer %', fmt:fmtPct}, {key:'ibWarmT', label:'IB Warm Transfer %', fmt:fmtPct}, {key:'obWarmT', label:'OB Warm Transfer %', fmt:fmtPct},
    {key:'showRate', label:'Show Rate %', fmt:fmtPct}, {key:'ibShowRate', label:'IB Show Rate %', fmt:fmtPct}, {key:'obShowRate', label:'OB Show Rate %', fmt:fmtPct},
    {key:'shows', label:'Shows'}, {key:'ibShows', label:'IB Shows'}, {key:'obShows', label:'OB Shows'},
    {key:'bookingRate', label:'Booking Rate %', fmt:fmtPct}, {key:'ibBookingRate', label:'IB Booking Rate %', fmt:fmtPct}, {key:'obBookingRate', label:'OB Booking Rate %', fmt:fmtPct},
    {key:'revenue', label:'Upfront Revenue', fmt:v=>v==null?'—':fmtMoney(v)}, {key:'ibRevenue', label:'IB Revenue', fmt:v=>v==null?'—':fmtMoney(v)}, {key:'obRevenue', label:'OB Revenue', fmt:v=>v==null?'—':fmtMoney(v)},
    {key:'closedDeal', label:'Closed Deal'},
    {key:'calls90s', label:'90 sec Calls'}, {key:'ibCalls90s', label:'IB 90-sec Calls'}, {key:'obCalls90s', label:'OB 90-sec Calls'},
  ];
}

// 1. Executive Summary Trend
function renderExecSummary(t){
  const p = document.getElementById('panel-0');
  const rows = t.rows;
  const chartWindowNote = t.gran==='daily' ? `last ${t.chartRows.length} days` : (t.gran==='weekly' ? `last ${t.chartRows.length} weeks` : `last ${t.chartRows.length} months`);
  p.innerHTML = `
    <div class="metrics-container">
      ${kpiTile('Sets', fmtInt(sum(rows,'sets')), `IB ${fmtInt(sum(rows,'ibSets'))} · OB ${fmtInt(sum(rows,'obSets'))}`)}
      ${kpiTile('Appointments', fmtInt(sum(rows,'appt')))}
      ${kpiTile('Warm Transfer %', fmtPct(avg(rows,'warmT')), `IB ${fmtPct(avg(rows,'ibWarmT'))} · OB ${fmtPct(avg(rows,'obWarmT'))}`)}
      ${kpiTile('Shows', fmtInt(sum(rows,'shows')), `IB ${fmtInt(sum(rows,'ibShows'))} · OB ${fmtInt(sum(rows,'obShows'))}`)}
      ${kpiTile('Show Rate %', fmtPct(avg(rows,'showRate')), `IB ${fmtPct(avg(rows,'ibShowRate'))} · OB ${fmtPct(avg(rows,'obShowRate'))}`)}
      ${kpiTile('Booking Rate %', fmtPct(avg(rows,'bookingRate')), `IB ${fmtPct(avg(rows,'ibBookingRate'))} · OB ${fmtPct(avg(rows,'obBookingRate'))}`)}
      ${kpiTile('Upfront Revenue', fmtMoney(sum(rows,'revenue')))}
      ${kpiTile('Closed Deal', fmtInt(sum(rows,'closedDeal')))}
      ${kpiTile('90 sec Calls', fmtInt(sum(rows,'calls90s')), `IB ${fmtInt(sum(rows,'ibCalls90s'))} · OB ${fmtInt(sum(rows,'obCalls90s'))}`)}
    </div>
    <div class="chart-card">
      <h3>Sets — Total / IB / OB <span style="color:var(--gray); font-weight:400; text-transform:none; letter-spacing:0">(${chartWindowNote})</span></h3>
      <div class="legend"><span><i style="background:var(--s-orange)"></i>Total</span><span><i style="background:var(--s-blue)"></i>IB</span><span><i style="background:var(--s-aqua)"></i>OB</span></div>
      <div id="chart-exec-sets"></div>
    </div>
    <div class="chart-card">
      <h3>Warm Transfer % — Total / IB / OB <span style="color:var(--gray); font-weight:400; text-transform:none; letter-spacing:0">(${chartWindowNote})</span></h3>
      <div class="legend"><span><i style="background:var(--s-orange)"></i>Total</span><span><i style="background:var(--s-blue)"></i>IB</span><span><i style="background:var(--s-aqua)"></i>OB</span></div>
      <div id="chart-exec-warmt"></div>
    </div>
    <div class="chart-card">
      <h3>Upfront Revenue over time <span style="color:var(--gray); font-weight:400; text-transform:none; letter-spacing:0">(${chartWindowNote})</span></h3>
      <div class="legend"><span><i style="background:var(--s-aqua)"></i>Revenue ($)</span></div>
      <div id="chart-exec-rev"></div>
    </div>
    <div class="section-title">Period detail — all 23 metrics, as shown on the sheet</div>
    <div class="note">Daily rows don't carry an IB/OB Revenue split in the source (only Weekly/Monthly do) — shown as "—". The table below reflects your exact date selection; the charts above always show the fuller ${chartWindowNote} trend so the line reads clearly.</div>
    <div class="table-section"><table><thead id="tbl-exec-head"></thead><tbody id="tbl-exec-body"></tbody></table></div>
  `;
  lineChart('chart-exec-sets', t.chartRows, [
    {key:'sets', name:'Sets', color:getVar('--s-orange')},
    {key:'ibSets', name:'IB Sets', color:getVar('--s-blue')},
    {key:'obSets', name:'OB Sets', color:getVar('--s-aqua')},
  ], t.label);
  lineChart('chart-exec-warmt', t.chartRows, [
    {key:'warmT', name:'Warm Transfer %', color:getVar('--s-orange'), fmt:fmtPct},
    {key:'ibWarmT', name:'IB Warm Transfer %', color:getVar('--s-blue'), fmt:fmtPct},
    {key:'obWarmT', name:'OB Warm Transfer %', color:getVar('--s-aqua'), fmt:fmtPct},
  ], t.label);
  lineChart('chart-exec-rev', t.chartRows, [{key:'revenue', name:'Revenue', color:getVar('--s-aqua'), fmt:fmtMoney}], t.label);
  const periodLabel = t.gran==='daily'?'Date':(t.gran==='weekly'?'Week Beginning':'Month');
  const cols = fullMetricCols('period', periodLabel);
  const withPeriod = rows.map(r=>({...r, period: t.label(r)}));
  renderTable('tbl-exec', withPeriod, cols);
}

function getVar(name){ return getComputedStyle(document.body).getPropertyValue(name).trim() || name; }

// 2. ASR Trend View — real per-team monthly rollup from the sheet's own Executive Summary Trend team blocks
function renderASRTrend(t){
  const p = document.getElementById('panel-1');
  const teamsToShow = state.team ? [state.team] : TEAMS;
  const monthsInRange = TREND_MONTHLY.filter(r=>inRange(r.month+'-01') || true).map(r=>r.month); // all 3 real months captured
  let teamMonthRows = TEAM_MONTHLY.filter(r=> teamsToShow.includes(r.team));
  // restrict to months overlapping the selected date range when possible
  const wanted = teamMonthRows.filter(r => r.month >= state.start.slice(0,7) && r.month <= state.end.slice(0,7));
  if(wanted.length) teamMonthRows = wanted;

  const latestMonth = "2026-09";
  const latest = teamsToShow.map(team => TEAM_MONTHLY.find(r=>r.team===team && r.month===latestMonth)).filter(Boolean);

  p.innerHTML = `
    <div class="metrics-container">
      ${kpiTile('Sets (Sep, selected teams)', fmtInt(sum(latest,'sets')), `IB ${fmtInt(sum(latest,'ibSets'))} · OB ${fmtInt(sum(latest,'obSets'))}`)}
      ${kpiTile('Warm Transfer %', fmtPct(avg(latest,'warmT')))}
      ${kpiTile('Shows', fmtInt(sum(latest,'shows')))}
      ${kpiTile('Booking Rate %', fmtPct(avg(latest,'bookingRate')))}
      ${kpiTile('Upfront Revenue', fmtMoney(sum(latest,'revenue')))}
      ${kpiTile('Closed Deal', fmtInt(sum(latest,'closedDeal')))}
    </div>
    <div class="chart-card">
      <h3>Sets by team — Jul / Aug / Sep</h3>
      <div class="legend">${teamsToShow.map((tm)=>`<span><i style="background:${getVar(['--s-orange','--s-blue','--s-aqua'][TEAMS.indexOf(tm)%3])}"></i>${tm}</span>`).join('')}</div>
      <div id="chart-asr-teamlines"></div>
    </div>
    <div class="chart-card">
      <h3>Sets by team (Sep, IB vs OB)</h3>
      <div id="chart-asr-teambar"></div>
    </div>
    <div class="section-title">Team monthly detail — all 23 metrics, as shown on the sheet</div>
    <div class="note">Real per-team rollups straight from Executive Summary Trend's own team blocks (Team Remen / Team Mimi / Team Mark), not a roster sum. Currently Monthly granularity only (Jul–Sep); the sheet doesn't keep per-team Weekly/Daily beyond the company-wide ASRs block.</div>
    <div class="table-section"><table><thead id="tbl-asrteam-head"></thead><tbody id="tbl-asrteam-body"></tbody></table></div>
  `;
  // team lines chart: one line per team, using 'month' as x
  const monthLabel = r => r.month.slice(5)+'/'+r.month.slice(2,4);
  const series = teamsToShow.map((team,i)=>({key:'__t'+i, name:team, color: getVar(['--s-orange','--s-blue','--s-aqua'][TEAMS.indexOf(team)%3])}));
  const merged = TREND_MONTHLY.map(mrow=>{
    const o = {month:mrow.month};
    teamsToShow.forEach((team,i)=>{ const tr = TEAM_MONTHLY.find(r=>r.team===team && r.month===mrow.month); o['__t'+i] = tr?tr.sets:0; });
    return o;
  });
  lineChart('chart-asr-teamlines', merged, series, monthLabel);
  const sepRows = teamsToShow.map(team=>TEAM_MONTHLY.find(r=>r.team===team && r.month==='2026-09')).filter(Boolean);
  barChart('chart-asr-teambar', sepRows, 'sets', r=>r.team, getVar('--s-orange'));
  renderTable('tbl-asrteam', teamMonthRows, fullMetricCols('month', 'Month'));
}

  const periodLabel = ct.gran==='daily'?'Date':(ct.gran==='weekly'?'Week Beginning':'Month');
  const withPeriod = rows.map(r=>({...r, period: ct.label(r)}));
  renderTable('tbl-closertrend', withPeriod, closerMetricCols('period', periodLabel));
}

// 4. Closers Metric
function renderClosersMetric(){
  const p = document.getElementById('panel-3');
  const closers = filteredClosers();
  const total = { name:'Grand Total', appt:sum(closers,'appt'), show:sum(closers,'show'), closedDeal:sum(closers,'closedDeal'),
    closeRate: closers.length? sum(closers,'closedDeal')/Math.max(sum(closers,'show'),1)*100:0,
    revenue: sum(closers,'revenue'), aov: avg(closers,'aov'), showRate: avg(closers,'showRate'), clubs:sum(closers,'clubs'), pg1:sum(closers,'pg1') };
  p.innerHTML = `
    <div class="metrics-container">
      ${kpiTile('Advisor Appt', fmtInt(total.appt))}
      ${kpiTile('Advisor Show', fmtInt(total.show))}
      ${kpiTile('Closed Deal', fmtInt(total.closedDeal))}
      ${kpiTile('Upfront Revenue', fmtMoney(total.revenue))}
      ${kpiTile('Avg AOV', fmtMoney(total.aov))}
    </div>
    <div class="section-title">Closer / PG1 Advisor detail</div>
    <div class="note">Current-period snapshot from Closers Metric — click a column header to sort.</div>
    <div class="table-section"><table><thead id="tbl-closers-head"></thead><tbody id="tbl-closers-body"></tbody></table></div>
  `;
  renderTable('tbl-closers', closers, [
    {key:'name', label:'Name'}, {key:'appt', label:'Advisor Appt'}, {key:'show', label:'Advisor Show'},
    {key:'closedDeal', label:'Closed Deal'}, {key:'closeRate', label:'Close Rate', fmt:fmtPct},
    {key:'revenue', label:'Upfront Revenue', fmt:fmtMoney}, {key:'aov', label:'AOV', fmt:fmtMoney},
    {key:'showRate', label:'Show Rate', fmt:fmtPct}, {key:'clubs', label:'Clubs'}, {key:'pg1', label:'PG1'},
  ]);
}

// 6. ASR Daily Metric (grouped by team, with subtotal rows)
function renderASRDailyMetric(){
  const p = document.getElementById('panel-5');
  p.innerHTML = `
    <div class="section-title">Team-grouped rep detail</div>
    <div class="note">Mirrors the sheet's team-grouped layout with subtotal rows; respects Team / Agent filters above.</div>
    <div class="table-section"><table><thead id="tbl-asrdaily-head"></thead><tbody id="tbl-asrdaily-body"></tbody></table></div>
  `;
  const cols = [
    {key:'team', label:'Team'}, {key:'name', label:'Name'}, {key:'sets', label:'Sets'},
    {key:'appt', label:'Appointments'}, {key:'show', label:'Show'}, {key:'noShow', label:'No Show'},
    {key:'showRate', label:'Show Rate', fmt:fmtPct}, {key:'bookingRate', label:'Booking Rate', fmt:fmtPct},
    {key:'revenue', label:'Upfront Revenue', fmt:fmtMoney},
  ];
  let rows = [];
  const teamsToShow = state.team ? [state.team] : TEAMS;
  teamsToShow.forEach(team=>{
    let reps = ASR_REPS.filter(r=>r.team===team);
    if(state.agent) reps = reps.filter(r=>r.name===state.agent);
    if(!reps.length) return;
    rows = rows.concat(reps);
    rows.push({team:team, name:team+' Total', sets:sum(reps,'sets'), appt:sum(reps,'appt'), show:sum(reps,'show'),
      noShow:sum(reps,'noShow'), showRate:avg(reps,'showRate'), bookingRate:avg(reps,'bookingRate'), revenue:sum(reps,'revenue'), _subtotal:true});
  });
  renderTable('tbl-asrdaily', rows, cols, { rowClass:r=> r._subtotal?'subtotal':'' });
}

// 7. BR % per Call Source

  else if(state.team){ const names = new Set(ASR_REPS.filter(r=>r.team===state.team).map(r=>r.name)); rows = rows.filter(r=>names.has(r.name)); }
  p.innerHTML = `
    <div class="section-title">Booking Rate % by IVR call source</div>
    <div class="note">Sample of reps captured live from BR % per Call Source (booking rate can exceed 100% when one rep books multiple appointments from fewer unique inbound calls in the source data).</div>
    <div class="table-section"><table><thead id="tbl-br-head"></thead><tbody id="tbl-br-body"></tbody></table></div>
  `;
  renderTable('tbl-br', rows, [
    {key:'name', label:'Name'},
    {key:'ivr1Calls', label:'IVR1 Calls'}, {key:'ivr1BR', label:'IVR1 Booking %', fmt:fmtPct},
    {key:'ivr2Calls', label:'IVR2 Calls'}, {key:'ivr2BR', label:'IVR2 Booking %', fmt:fmtPct},

}
