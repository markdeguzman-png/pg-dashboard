<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Golf — ASR &amp; Closer Report Dashboard</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --orange:#FD3300;
    --dark-orange:#DB2C00;
    --black:#1D1A1A;
    --panel:#2A2A2A;
    --gray:#7B726C;
    --light-gray:#DFD9D5;
    --white:#FFFFFF;
    --line:#333;
    --good:#4CAF50;
    --warn:#eda100;
    --bad:#e34948;
    /* categorical series — PG orange holds slot 2 of the validated 8-hue order, rest untouched */
    --s-blue:#3987e5;
    --s-orange:#FD3300;
    --s-aqua:#199e70;
    --s-yellow:#c98500;
    --s-magenta:#d55181;
    --s-violet:#9085e9;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--black);
    color:var(--white);
    padding:20px;
  }

  .header{
    background:linear-gradient(135deg, var(--black) 0%, rgba(253,51,0,0.12) 100%);
    border-bottom:3px solid var(--orange);
    padding:26px 30px;
    margin-bottom:22px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  .header h1{ font-size:28px; color:var(--orange); margin-bottom:6px; }
  .header p{ font-size:13px; color:var(--gray); text-transform:uppercase; letter-spacing:1px; }
  .header .asof{ font-size:12px; color:var(--light-gray); text-align:right; }
  .header .asof b{ color:var(--white); }

  .filters{
    background:var(--panel);
    border:1px solid var(--line);
    padding:18px 20px;
    margin-bottom:18px;
    border-radius:8px;
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:flex-end;
  }
  /* display:contents unwraps these groupings so their children lay out directly in the
     .filters row (one line on wide screens) while still wrapping together on narrow ones */
  .date-row, .dim-row{ display:contents; }
  .filter-group{ display:flex; flex-direction:column; gap:6px; min-width:150px; }
  .filter-group.grow{ flex:0 1 240px; min-width:180px; }
  .filter-group label{ font-size:11px; color:var(--gray); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
  .filter-group select, .filter-group input[type=date]{
    padding:10px 12px; background:#F4F2F0; border:1px solid var(--light-gray);
    border-radius:4px; color:var(--black); font-size:13px; font-family:inherit;
  }
  .filter-group select:disabled{ opacity:.45; cursor:not-allowed; }

  /* Multi-select widget (Team / Agent) -- a button showing a summary label, opening a checkbox
     panel on click. Styled to match the plain <select> elements beside it (LOB stays a native
     single-select; only Team/Agent support picking more than one). */
  .multiselect{ position:relative; }
  .multiselect-btn{
    width:100%; text-align:left; padding:10px 30px 10px 12px; background:#F4F2F0; border:1px solid var(--light-gray);
    border-radius:4px; color:var(--black); font-size:13px; font-family:inherit; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:relative;
  }
  .multiselect-btn::after{
    content:'▾'; position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--gray); font-size:11px;
  }
  .multiselect-btn:hover{ border-color:var(--orange); }
  .multiselect.open .multiselect-btn{ border-color:var(--orange); }
  .multiselect-panel{
    display:none; position:absolute; top:calc(100% + 4px); left:0; min-width:100%; width:max-content; max-width:320px;
    background:#F4F2F0; border:1px solid var(--orange); border-radius:4px; box-shadow:0 8px 20px rgba(0,0,0,0.5);
    z-index:50; max-height:320px; overflow-y:auto; padding:6px;
  }
  .multiselect.open .multiselect-panel{ display:block; }
  .multiselect-search{
    width:100%; padding:7px 9px; margin-bottom:4px; border:1px solid var(--light-gray); border-radius:3px;
    font-size:12.5px; font-family:inherit; color:var(--black); background:var(--white);
  }
  .multiselect-actions{ display:flex; gap:10px; padding:4px 6px 6px; font-size:11px; }
  .multiselect-actions a{ color:var(--dark-orange); cursor:pointer; font-weight:700; text-decoration:none; }
  .multiselect-actions a:hover{ text-decoration:underline; }
  .multiselect-group-label{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--gray);
    padding:6px 6px 2px;
  }
  .multiselect-option{
    display:flex; align-items:center; gap:7px; padding:5px 6px; border-radius:3px; font-size:12.5px; color:var(--black);
    cursor:pointer; white-space:nowrap;
  }
  .multiselect-option:hover{ background:rgba(253,51,0,0.10); }
  .multiselect-option input{ margin:0; flex:none; }
  .multiselect-empty{ padding:10px 6px; font-size:12px; color:var(--gray); text-align:center; }
  .presets{ display:flex; gap:6px; flex-wrap:wrap; }
  .preset-btn{
    padding:8px 12px; background:transparent; border:1px solid var(--light-gray);
    color:var(--light-gray); border-radius:4px; font-size:12px; cursor:pointer; font-weight:600;
  }
  .preset-btn:hover, .preset-btn.active{ background:var(--orange); border-color:var(--orange); color:var(--white); }
  .reset-btn{
    padding:10px 16px; background:transparent; border:1px solid var(--orange); color:var(--orange);
    border-radius:4px; font-size:12px; font-weight:700; cursor:pointer; text-transform:uppercase;
  }
  .reset-btn:hover{ background:var(--orange); color:var(--white); }
  .gran-note{ font-size:11px; color:var(--gray); margin-top:4px; }

  .main-tabs{
    display:flex; gap:10px; margin-bottom:18px;
  }
  .main-tab{
    flex:1; padding:14px 20px; background:var(--panel); border:2px solid var(--line); border-radius:8px;
    color:var(--light-gray); cursor:pointer; font-size:15px; font-weight:800; text-transform:uppercase;
    letter-spacing:0.5px; transition:all .2s;
  }
  .main-tab.active{ background:var(--orange); border-color:var(--orange); color:var(--white); }
  .main-tab:hover:not(.active){ border-color:var(--orange); color:var(--white); }

  .tabs{
    display:flex; gap:4px; margin-bottom:20px; border-bottom:2px solid var(--line);
    overflow-x:auto; padding-bottom:1px;
  }
  .tab{
    padding:13px 20px; background:transparent; border:none; color:var(--gray); cursor:pointer;
    font-size:16px; font-weight:600; white-space:nowrap; border-bottom:3px solid transparent; transition:all .2s;
  }
  .tab.active{ color:var(--orange); border-bottom-color:var(--orange); }
  .tab:hover{ color:var(--white); }

  .tab-content{ display:none; }
  .tab-content.active{ display:block; }

  .section-title{ font-size:14px; color:var(--light-gray); text-transform:uppercase; letter-spacing:0.5px; margin:26px 0 12px; font-weight:700; }
  .note{ font-size:11px; color:var(--gray); margin-bottom:14px; font-style:italic; }
  .scope-banner{
    background:rgba(253,51,0,0.08); border:1px solid rgba(253,51,0,0.35); border-radius:6px;
    padding:10px 14px; font-size:12px; color:var(--light-gray); margin-bottom:16px;
  }
  .scope-banner b{ color:var(--white); }
  .scope-banner.blocked{ background:rgba(227,73,72,0.10); border-color:rgba(227,73,72,0.45); color:var(--white); font-weight:600; }

  .metrics-container{ display:flex; gap:12px; margin-bottom:10px; }
  .metrics-container .metric{ flex:1 1 0; min-width:0; padding:14px 12px; }
  .metrics-container .metric-value{ font-size:22px; }
  @media (max-width: 900px){
    .metrics-container{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
    .metrics-container .metric{ flex:none; padding:20px; }
    .metrics-container .metric-value{ font-size:32px; }
  }
  .metric{ background:linear-gradient(135deg,var(--panel) 0%,var(--black) 100%); border:1px solid var(--line);
    padding:20px; border-radius:8px; border-left:4px solid var(--orange); }
  .metric-label{ font-size:11px; color:var(--gray); text-transform:uppercase; letter-spacing:1px; font-weight:700; margin-bottom:10px; }
  .metric-value{ font-size:32px; font-weight:700; color:var(--orange); line-height:1; font-variant-numeric:tabular-nums; }
  .metric-sub{ font-size:11px; color:var(--gray); margin-top:6px; }

  .chart-card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px; margin-top:18px; }
  .chart-card h3{ font-size:13px; color:var(--light-gray); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
  /* Monthly:Weekly:Daily width ratio -- Daily gets the most horizontal room to spread its ~30
     points out, Weekly a bit more than Monthly's 3-bar chart needs. */
  .chart-row{ display:grid; grid-template-columns:1fr 1.5fr 3fr; gap:16px; margin-top:18px; }
  .chart-row .chart-card{ margin-top:0; }
  @media (max-width: 900px){ .chart-row{ grid-template-columns:1fr; } }
  .legend{ display:flex; gap:14px; font-size:11px; color:var(--gray); margin:6px 0 10px; flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; }

  /* Shared floating tooltip -- one element reused by every chart (line/column/bar), showing every
     series' value together on hover instead of the browser's native single-value <title>. */
  .chart-tooltip{
    position:fixed; pointer-events:none; z-index:1000; background:#1D1A1A; border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; font-size:11px; color:var(--white); box-shadow:0 4px 14px rgba(0,0,0,0.45);
    display:none; white-space:nowrap; line-height:1.7;
  }
  .chart-tooltip .ct-title{ font-weight:700; color:var(--light-gray); margin-bottom:4px; }
  .chart-tooltip .ct-row{ display:flex; align-items:center; gap:6px; }
  .chart-tooltip .ct-dot{ width:8px; height:8px; border-radius:2px; display:inline-block; flex:none; }

  .table-section{ background:linear-gradient(135deg,var(--panel) 0%,var(--black) 100%);
    border:1px solid var(--line); border-radius:8px; overflow:auto; margin-top:18px; max-height:560px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead{ background:#3a3a3a; border-bottom:2px solid var(--orange); position:sticky; top:0; z-index:1; }
  th{ padding:11px 12px; text-align:left; color:var(--white); font-weight:700; text-transform:uppercase; font-size:10.5px; letter-spacing:.4px; white-space:nowrap;
      cursor:pointer; user-select:none; }
  th:hover{ color:var(--orange); }
  th.sorted::after{ content:' ▾'; color:var(--orange); }
  td{ padding:9px 12px; border-bottom:1px solid var(--line); color:var(--white); white-space:nowrap; font-variant-numeric:tabular-nums; }
  tbody tr:hover{ background:rgba(253,51,0,0.07); }
  tbody tr.subtotal{ background:rgba(253,51,0,0.10); font-weight:700; }
  /* Frozen/sticky columns for wide tables -- left offset is computed per-table in JS (actual
     rendered width, not a hardcoded guess), these just handle the positioning + opaque
     background so scrolling content doesn't show through underneath. */
  th.sticky-col{ position:sticky; z-index:3; background:#3a3a3a; box-shadow:2px 0 4px rgba(0,0,0,0.3); overflow:hidden; text-overflow:ellipsis; }
  td.sticky-col{ position:sticky; z-index:1; background:#242424; box-shadow:2px 0 4px rgba(0,0,0,0.3); overflow:hidden; text-overflow:ellipsis; }
  tbody tr.subtotal td.sticky-col{ background:linear-gradient(rgba(253,51,0,0.10),rgba(253,51,0,0.10)),#242424; }
  .no-data{ text-align:center; padding:40px 20px; color:var(--gray); }
  .pill{ padding:2px 8px; border-radius:10px; font-size:10.5px; font-weight:700; }
  .pill.good{ background:rgba(76,175,80,.18); color:var(--good); }
  .pill.bad{ background:rgba(227,73,72,.18); color:var(--bad); }

  .update-time{ text-align:right; font-size:11px; color:var(--gray); padding:14px 4px 4px; }
</style>
</head>
<body>

  <div class="header">
    <div>
      <h1>⚡ PERFORMANCE GOLF</h1>

    </div>

  </div>

    </div>
    <div class="dim-row">

      <div class="filter-group">
        <label>Team</label>

  </div>
  <div class="gran-note" id="granNote"></div>

  <div id="panels"></div>

  <div class="update-time">Data updated <span id="dataUpdatedFooter">—</span> · Filters apply live to every tab</div>

<script>
// ===== inlined data (see asr_closer_data.js for the commented, standalone copy) =====
// Computed live from the browser's clock at page load, in America/New_York, instead of a
// hardcoded string -- a fixed ASOF value goes stale every day it isn't manually bumped (it
// silently sat one calendar day behind real EDT "today" until this was caught). This always
// reflects the real current EDT date, regardless of when the page happens to be loaded.
const ASOF = (() => {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date());
  const y = parts.find(p=>p.type==='year').value;
  const m = parts.find(p=>p.type==='month').value;
  const d = parts.find(p=>p.type==='day').value;
  return `${y}-${m}-${d}`;
})();

// time) -- a fixed historical fact, not something to recompute live. Update this ISO string each
// time the embedded data is refreshed from a new pull. Displayed in EDT for consistency with ASOF.
const DATA_UPDATED_AT_ISO = "2026-10-02T15:48:37.842Z";
const DATA_UPDATED_AT = new Intl.DateTimeFormat('en-US', {
  timeZone: 'America/New_York', dateStyle: 'medium', timeStyle: 'short'
}).format(new Date(DATA_UPDATED_AT_ISO)) + ' ET';

const TREND_FIELDS = ["sets","ibSets","obSets","appt","warmT","ibWarmT","obWarmT","showRate","ibShowRate","obShowRate",
  "shows","ibShows","obShows","bookingRate","ibBookingRate","obBookingRate","revenue","ibRevenue","obRevenue",
  "closedDeal","calls90s","ibCalls90s","obCalls90s","ibCalls","obCalls","connectRate"];
function rowsToObjs(keyName, rows, fields){
  return rows.map(r => { const o = {[keyName]: r[0]}; fields.forEach((f,i)=> o[f]=r[i+1]); return o; });
}

// Daily/Weekly captured 2026-09-28; the sheet's IB Calls / OB Calls / Connect Rate rows weren't

// Generic checkbox-dropdown multi-select, used for both Team and Agent (native <select multiple>
// needs ctrl/cmd+click, which most people never discover -- this is a button + checkbox panel
// instead). `getOptionGroups()` returns [{label, options:[string,...]}, ...] (label:null for a
// flat list); `getSelected()`/`setSelected(arr)` read/write the backing state array and perform
// whatever side effects (re-render, dependent-dropdown rebuilds) that filter needs.
function setupMultiSelect({wrapId, btnId, panelId, allLabel, getOptionGroups, getSelected, setSelected, search}){
  const wrap = document.getElementById(wrapId);
  const btn = document.getElementById(btnId);
  const panel = document.getElementById(panelId);

  function labelFor(){
    const selected = getSelected();
    if(!selected.length) return allLabel;
    if(selected.length===1) return selected[0];
    return selected.length + ' selected';
  }

  function renderPanel(filterText){
    const selected = getSelected();
    const groups = getOptionGroups();
    const ft = (filterText||'').toLowerCase();
    let html = '';
    if(search) html += `<input type="text" class="multiselect-search" placeholder="Search...">`;
    html += `<div class="multiselect-actions"><a data-action="all">Select all</a><a data-action="clear">Clear</a></div>`;
    let anyOption = false;
    groups.forEach(g => {
      const opts = g.options.filter(o => !ft || o.toLowerCase().includes(ft));
      if(!opts.length) return;
      anyOption = true;
      if(g.label) html += `<div class="multiselect-group-label">${g.label}</div>`;
      opts.forEach(o => {
        const checked = selected.includes(o);
        html += `<label class="multiselect-option"><input type="checkbox" value="${o.replace(/"/g,'&quot;')}" ${checked?'checked':''}>${o}</label>`;
      });
    });
    if(!anyOption) html += `<div class="multiselect-empty">No matches</div>`;
    panel.innerHTML = html;
    if(filterText){ const si = panel.querySelector('.multiselect-search'); if(si){ si.value = filterText; } }

    const searchInput = panel.querySelector('.multiselect-search');
    if(searchInput){
      searchInput.addEventListener('click', ev=>ev.stopPropagation());
      searchInput.addEventListener('input', (ev)=>{
        const caret = ev.target.selectionStart;
        renderPanel(ev.target.value);
        const si2 = panel.querySelector('.multiselect-search');
        if(si2){ si2.focus(); si2.setSelectionRange(caret, caret); }
      });
    }
    panel.querySelector('[data-action="all"]').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const visible = groups.flatMap(g=>g.options).filter(o => !ft || o.toLowerCase().includes(ft));
      setSelected(Array.from(new Set([...getSelected(), ...visible])));
      btn.textContent = labelFor();
      renderPanel(ft);
    });
    panel.querySelector('[data-action="clear"]').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      setSelected([]);
      btn.textContent = labelFor();
      renderPanel(ft);
    });
    panel.querySelectorAll('.multiselect-option').forEach(lbl=>lbl.addEventListener('click', ev=>ev.stopPropagation()));
    panel.querySelectorAll('.multiselect-option input').forEach(cb=>{
      cb.addEventListener('change', ()=>{

  wrap._msRefresh = () => { btn.textContent = labelFor(); if(wrap.classList.contains('open')) renderPanel(''); };

function fmtInt(n){ return Math.round(n).toLocaleString(); }
function fmtMoney(n){ return '$' + Math.round(n).toLocaleString(); }
function fmtPct(n){ return (Math.round(n*10)/10).toFixed(1) + '%'; }
// Timezone-safe YYYY-MM-DD formatter. `d` is always constructed as LOCAL midnight in this file
// (e.g. `new Date(y, m, 1)`), so formatting via toISOString() (which converts to UTC first) would
// silently roll the date back by one day for any viewer east of UTC — this reads the same local
// fields the Date was built from instead.
function dstr(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// Agent's available options depend on the current Team/LOB selection -- shared by the Agent
// multiselect's own option list AND by pruneAgentSelection() below (dropping any selected name
// that's no longer valid once Team/LOB narrows).
function agentOptionGroups(){
  const roster = state.team.length ? LIVE_ROSTER.filter(r=>state.team.includes(r.team)) : LIVE_ROSTER;
  const byName = (a,b) => a.name.localeCompare(b.name);
  // A specific LOB is selected -- just list that LOB's people alphabetically, no need for the
  // ASR/Closer/Other grouping split below (there's only one group once narrowed this far). This
  // also makes any of the 13 real LOB values work correctly, not just ASR/Closer - Outbound.
  if (state.lob) {
    return [{label:null, options: roster.filter(r=>r.lob===state.lob).sort(byName).map(r=>r.name)}];
  }
  // No LOB filter: keep the familiar grouped view. Internal Setter reps fall under "ASR /
  // Setters" alongside ASR (both are SETTER_LOBS) rather than "Other", since that's the scope
  // SETTER's tabs actually compute over when nothing more specific is picked.
  const asrReps = roster.filter(r=>SETTER_LOBS.includes(r.lob)).sort(byName).map(r=>r.name);
  const closers = roster.filter(r=>isCloserLob(r.lob)).sort(byName).map(r=>r.name);
  const others = roster.filter(r=>!SETTER_LOBS.includes(r.lob) && !isCloserLob(r.lob)).sort(byName).map(r=>r.name);
  const groups = [];
  if (asrReps.length) groups.push({label:'ASR / Setters', options:asrReps});
  if (closers.length) groups.push({label:'Closers / PG1 Advisors', options:closers});
  if (others.length) groups.push({label:'Other (non-ASR/Closer)', options:others});
  return groups;
}

// LOB (Line of Business) and Team both come straight from Sched's own LOB / Current LOB / Team
// columns, via LIVE_ROSTER (derived from RAW_SCHED). The Team dropdown always lists every real
// team in the current roster, regardless of which LOB is active — selecting a team outside the
// ASR/Closer split (Support, Team Philip, ...) leaves LOB on "All" (see the change handler above)
// so whatever real ASR/Closer activity those people have still surfaces correctly.
function rebuildLobOptions(){
  const sel = document.getElementById('lobFilter');
  const prev = state.lob;
  const allowed = MAIN_TABS[activeMainTab].lobs;
  sel.innerHTML = '<option value="">All LOBs</option>';
  ALL_LOBS.filter(l => allowed.includes(l)).forEach(l => { const o=document.createElement('option'); o.value=l; o.textContent=l; sel.appendChild(o); });
  const stillValid = [...sel.options].some(o=>o.value===prev);
  sel.value = stillValid ? prev : '';
  state.lob = sel.value;
}

function inRange(dateStr){
  return dateStr >= state.start && dateStr <= state.end;
}

// pick finest granularity that has data in range
function addDaysStr(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return dstr(d);
}
function endOfMonthStr(monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  const d = new Date(y, m, 0); // day 0 of next month = last day of this month
  return dstr(d);
}
// Only the START of the selection has to fall inside a granularity's real coverage window.
// The END is deliberately not checked against the window's upper bound: the most recent
// day/week is always going to trail "today" by design (the sheet itself lags by ~1 day
// before a period is fully tallied), so requiring the END to fit too would kick almost any
// range ending "today" straight to the coarsest granularity, even when the START is well
// within daily or weekly coverage.
function fitsWindow(min, max){
  return state.start >= min && state.start <= max;
}

// Picks the FINEST granularity whose real data window fully covers the selected range —
// Daily now covers the full RAW_SCHED window (2026-06-30 onward); a range starting before that
// falls back to Weekly, and a range before the Weekly window falls back to Monthly, instead
// of silently summing only the days/weeks that happen to overlap (which under-counts and
// makes different ranges look identical).
// chartRows is deliberately NOT range-filtered the same way as rows/KPIs: a chart with a single
// point reads as broken, so it always shows the fullest real trend window for the active
// granularity (last ~30 days when daily, all 6 weeks when weekly, all 3 months when monthly) —
// while the KPI tiles/table above stay exact to the selected date range.
function trendForRange(){
  // LOB gate: this is the ASR company trend (sourced from the sheet's "ASRs" block); if the
  // Closer LOB is active there is nothing here to show — CLOSER Trend View is the equivalent.
  if (isCloserLob(state.lob)) {
    return { gran:'monthly', rows:[], chartRows:[], label:r=>r.month, blocked:true,
      blockedReason:'LOB is set to Closer, but this is the ASR company trend — switch LOB to ASR or All to see it (or open CLOSER Trend View).' };
  }
  // Team and/or LOB scope: compute the matching Daily/Weekly/Monthly live from RAW_SCHED (the
  // same cascade as the company-wide path below) whenever either filter narrows the view, instead
  // of the static TEAM_MONTHLY snapshot that was only ever captured once early in this
  // dashboard's build and had since drifted from reality (e.g. Team Mimi's Sep MTD Sets read
  // 1,418 there against 1,539 live). An LOB-only selection (no team) still routes through here --
  // state.team is passed through as-is ([] meaning "no team restriction", possibly multiple teams
  // selected) and teamRawAggBy / matchesLobFilter apply whichever of the two filters is actually set.
  if (state.team.length || state.lob) {
    const teamDaily = teamDailyRowsFor(state.team);
    if (!teamDaily.length) {
      return { gran:'monthly', rows:[], chartRows:[], label:r=>r.month, teamScoped:true, teamScopedEmpty:true };
    }
    const teamWeekly = teamWeeklyRowsFor(state.team);
    const teamMonthly = teamMonthlyRowsFor(state.team);
    const tDailyMin = teamDaily[0].date, tDailyMax = teamDaily[teamDaily.length-1].date;
    // The selection starts AFTER the latest day Sched has posted for this team at all -- there is
    // no data for any granularity here, so say so plainly instead of letting the weekly/monthly
    // fallback below silently substitute a different period's totals under the selected range.
    if (state.start > tDailyMax) {
      return {gran:'daily', rows:[], chartRows: teamDaily.slice(-30), label:r=>r.date.slice(5), teamScoped:true, noDataYet:true, noDataYetMax: tDailyMax};
    }
    if (fitsWindow(tDailyMin, tDailyMax)) {
      return {gran:'daily', rows: teamDaily.filter(r=>inRange(r.date)), chartRows: teamDaily.slice(-30), label:r=>r.date.slice(5), teamScoped:true};
    }
    const monthKey = state.start.slice(0,7);
    if (monthKey === state.end.slice(0,7)) {
      const monthRow = teamMonthly.find(r=>r.month===monthKey);
      if (monthRow) {
        const monthStart = monthRow.month+'-01', monthEnd = endOfMonthStr(monthRow.month);
        const effectiveEnd = monthEnd < ASOF ? monthEnd : ASOF;
        if (state.start <= monthStart && state.end >= effectiveEnd) {
          return {gran:'monthly', rows:[monthRow], chartRows: teamMonthly.slice(-3), label:r=>r.month, exactMonth:true, teamScoped:true};
        }
      }
    }
    const tWeeklyMin = teamWeekly[0].weekBeginning, tWeeklyMax = addDaysStr(teamWeekly[teamWeekly.length-1].weekBeginning, 6);
    if (fitsWindow(tWeeklyMin, tWeeklyMax)) {
      const rows = teamWeekly.filter(r => r.weekBeginning <= state.end && addDaysStr(r.weekBeginning,6) >= state.start);
      return {gran:'weekly', rows, chartRows: teamWeekly.slice(), label:r=>'WB '+r.weekBeginning.slice(5), teamScoped:true};
    }
    const rows = teamMonthly.filter(r => (r.month+'-01') <= state.end && endOfMonthStr(r.month) >= state.start);
    return {gran:'monthly', rows: rows.length?rows:teamMonthly, chartRows: teamMonthly.slice(-3), label:r=>r.month, teamScoped:true};
  }
  const dailyMin = TREND_DAILY[0].date, dailyMax = TREND_DAILY[TREND_DAILY.length-1].date;
  // Same "nothing recorded yet" guard as the team-scoped branch above: if the selection starts
  // after the latest day Sched has posted, every granularity is empty for this range -- don't let
  // the weekly/monthly fallback further down silently show a different period's totals instead.
  if (state.start > dailyMax) {
    return {gran:'daily', rows:[], chartRows: TREND_DAILY.slice(-30), label:r=>r.date.slice(5), noDataYet:true, noDataYetMax: dailyMax};
  }
  if (fitsWindow(dailyMin, dailyMax)) {
    return {gran:'daily', rows: TREND_DAILY.filter(r=>inRange(r.date)), chartRows: TREND_DAILY.slice(-30), label:r=>r.date.slice(5)};
  }
  // Whole-month / month-to-date shortcut: when the selection is entirely within one calendar
  // month AND spans from that month's start through today (or the month's end, for a past
  // month), use the sheet's own real Monthly figure directly instead of approximating by summing
  // whichever Weekly buckets happen to overlap — those buckets cross month boundaries, so a
  // weekly-sum approximation systematically disagrees with the sheet's actual Monthly column
  // (e.g. "Month to Date" for September was showing a reconstructed ~4,962 Sets against the
  // sheet's real 4,707).
  const monthKey = state.start.slice(0,7);
  if (monthKey === state.end.slice(0,7)) {
    const monthRow = TREND_MONTHLY.find(r=>r.month===monthKey);
    if (monthRow) {
      const monthStart = monthRow.month+'-01', monthEnd = endOfMonthStr(monthRow.month);
      const effectiveEnd = monthEnd < ASOF ? monthEnd : ASOF;
      if (state.start <= monthStart && state.end >= effectiveEnd) {
        return {gran:'monthly', rows:[monthRow], chartRows: TREND_MONTHLY.slice(-3), label:r=>r.month, exactMonth:true};
      }
    }
  }
  const weeklyMin = TREND_WEEKLY[0].weekBeginning, weeklyMax = addDaysStr(TREND_WEEKLY[TREND_WEEKLY.length-1].weekBeginning, 6);
  if (fitsWindow(weeklyMin, weeklyMax)) {
    const rows = TREND_WEEKLY.filter(r => r.weekBeginning <= state.end && addDaysStr(r.weekBeginning,6) >= state.start);
    return {gran:'weekly', rows, chartRows: TREND_WEEKLY.slice(), label:r=>'WB '+r.weekBeginning.slice(5)};
  }
  const rows = TREND_MONTHLY.filter(r => (r.month+'-01') <= state.end && endOfMonthStr(r.month) >= state.start);
  return {gran:'monthly', rows: rows.length?rows:TREND_MONTHLY, chartRows: TREND_MONTHLY.slice(-3), label:r=>r.month};
}

function closerTrendForRange(){
  // LOB gate: this is the Closer company trend; if a SETTER-side LOB is active, nothing here
  // applies — Executive Summary Trend is the equivalent. (In practice the CLOSER main tab's LOB
  // dropdown only ever offers Closer - Outbound, so this mainly guards against stale state.)
  if (SETTER_LOBS.includes(state.lob)) {

      blockedReason:`LOB is set to ${state.lob}, but this is the Closer company trend — switch LOB to Closer or All to see it (or open Executive Summary Trend).` };

  const dailyMin = CLOSER_TREND_DAILY[0].date, dailyMax = CLOSER_TREND_DAILY[CLOSER_TREND_DAILY.length-1].date;
  // Same "nothing recorded yet" guard as trendForRange() above.
  if (state.start > dailyMax) {
    return {gran:'daily', rows:[], chartRows: CLOSER_TREND_DAILY.slice(-30), label:r=>r.date.slice(5), noDataYet:true, noDataYetMax: dailyMax};
  }
  if (fitsWindow(dailyMin, dailyMax)) {
    return {gran:'daily', rows: CLOSER_TREND_DAILY.filter(r=>inRange(r.date)), chartRows: CLOSER_TREND_DAILY.slice(-30), label:r=>r.date.slice(5)};
  }
  // Same whole-month / month-to-date shortcut as trendForRange() — prefer the sheet's real
  // Monthly figure over a weekly-sum approximation that crosses month boundaries.
  const monthKey = state.start.slice(0,7);
  if (monthKey === state.end.slice(0,7)) {
    const monthRow = CLOSER_TREND_MONTHLY.find(r=>r.month===monthKey);
    if (monthRow) {
      const monthStart = monthRow.month+'-01', monthEnd = endOfMonthStr(monthRow.month);
      const effectiveEnd = monthEnd < ASOF ? monthEnd : ASOF;
      if (state.start <= monthStart && state.end >= effectiveEnd) {
        return {gran:'monthly', rows:[monthRow], chartRows: CLOSER_TREND_MONTHLY.slice(-3), label:r=>r.month, exactMonth:true};
      }
    }
  }
  const weeklyMin = CLOSER_TREND_WEEKLY[0].weekBeginning, weeklyMax = addDaysStr(CLOSER_TREND_WEEKLY[CLOSER_TREND_WEEKLY.length-1].weekBeginning, 6);
  if (fitsWindow(weeklyMin, weeklyMax)) {
    const rows = CLOSER_TREND_WEEKLY.filter(r => r.weekBeginning <= state.end && addDaysStr(r.weekBeginning,6) >= state.start);
    return {gran:'weekly', rows, chartRows: CLOSER_TREND_WEEKLY.slice(), label:r=>'WB '+r.weekBeginning.slice(5)};
  }
  const rows = CLOSER_TREND_MONTHLY.filter(r => (r.month+'-01') <= state.end && endOfMonthStr(r.month) >= state.start);
  return {gran:'monthly', rows: rows.length?rows:CLOSER_TREND_MONTHLY, chartRows: CLOSER_TREND_MONTHLY.slice(-3), label:r=>r.month};
}

// RAW_SCHED-backed aggregation: sums the live per-rep-per-day fact rows across whatever the
// selected date range actually covers, instead of relying on a single pre-captured snapshot.
// This is what makes Rep per Metric / Closers Metric / ASR Daily Metric / BR % per Call Source
// genuinely follow the date range filter, not just Team/Agent.
const RAW_SCHED_MIN_DATE = RAW_SCHED.reduce((m,r)=>r[3]<m?r[3]:m, RAW_SCHED[0][3]);
const RAW_SCHED_MAX_DATE = RAW_SCHED.reduce((m,r)=>r[3]>m?r[3]:m, RAW_SCHED[0][3]);

function aggregateRawSched(rows){
  const byName = new Map();
  for(const r of rows){
    const [name,team,lob,,sets,ibSets,obSets,appt,ibAppt,obAppt,warmSet,ibWarmSet,obWarmSet,
      show,ibShow,obShow,calls90s,ibCalls90s,obCalls90s,revenue,ibRevenue,obRevenue,closedDeal,
      ibCalls,obCalls,closerAppts,closerShow,closerClosedDeal,closerRevenue,closerProductsSold,
      closerClubs,closerPG1,ivr1Calls,ivr2Calls,ivr3Calls,ivr4Calls,
      ivr1Sets,ivr2Sets,ivr3Sets,ivr4Sets,closerApptsLessCancelled,closerRS1] = r;
    if(!byName.has(name)) byName.set(name, {name, team, lob,
      sets:0, ibSets:0, obSets:0, appt:0, ibAppt:0, obAppt:0, warmSet:0, ibWarmSet:0, obWarmSet:0,
      show:0, ibShow:0, obShow:0, calls90s:0, ibCalls90s:0, obCalls90s:0, revenue:0, ibRevenue:0,
      obRevenue:0, closedDeal:0, ibCalls:0, obCalls:0,
      closerAppts:0, closerShow:0, closerClosedDeal:0, closerRevenue:0, closerProductsSold:0,
      closerClubs:0, closerPG1:0, ivr1Calls:0, ivr2Calls:0, ivr3Calls:0, ivr4Calls:0,
      ivr1Sets:0, ivr2Sets:0, ivr3Sets:0, ivr4Sets:0, closerApptsLessCancelled:0, closerRS1:0});
    const o = byName.get(name);
    o.team = team; o.lob = lob; // most recent row wins for current team/LOB
    o.sets+=sets; o.ibSets+=ibSets; o.obSets+=obSets; o.appt+=appt; o.ibAppt+=ibAppt; o.obAppt+=obAppt;
    o.warmSet+=warmSet; o.ibWarmSet+=ibWarmSet; o.obWarmSet+=obWarmSet;
    o.show+=show; o.ibShow+=ibShow; o.obShow+=obShow;
    o.calls90s+=calls90s; o.ibCalls90s+=ibCalls90s; o.obCalls90s+=obCalls90s;
    o.revenue+=revenue; o.ibRevenue+=ibRevenue; o.obRevenue+=obRevenue; o.closedDeal+=closedDeal;
    o.ibCalls+=ibCalls; o.obCalls+=obCalls;
    o.closerAppts+=closerAppts; o.closerShow+=closerShow; o.closerClosedDeal+=closerClosedDeal; o.closerRevenue+=closerRevenue;
    o.closerProductsSold+=closerProductsSold; o.closerClubs+=closerClubs; o.closerPG1+=closerPG1;
    o.ivr1Calls+=ivr1Calls; o.ivr2Calls+=ivr2Calls; o.ivr3Calls+=ivr3Calls; o.ivr4Calls+=ivr4Calls;
    o.ivr1Sets+=ivr1Sets; o.ivr2Sets+=ivr2Sets; o.ivr3Sets+=ivr3Sets; o.ivr4Sets+=ivr4Sets;
    o.closerApptsLessCancelled+=closerApptsLessCancelled; o.closerRS1+=closerRS1;
  }
  return Array.from(byName.values());
}

function rawSchedAggForRange(){
  const rows = RAW_SCHED.filter(r => r[3] >= state.start && r[3] <= state.end);
  return aggregateRawSched(rows);
}

// Per-rep version of the same 26 metrics/formulas used company-wide in Executive Summary Trend /
// ASR Trend View (see TREND_FIELDS) -- verified column-for-column against the live sheet's own
// SUMIFS formulas, just summed per person instead of company-wide.
function repMetrics26(o){
  const d = (a,b) => b ? a/b*100 : 0;
  return {
    sets: o.sets, ibSets: o.ibSets, obSets: o.obSets, appt: o.appt,
    warmT: d(o.warmSet,o.sets), ibWarmT: d(o.ibWarmSet,o.ibSets), obWarmT: d(o.obWarmSet,o.obSets),
    showRate: d(o.show,o.appt), ibShowRate: d(o.ibShow,o.ibAppt), obShowRate: d(o.obShow,o.obAppt),
    shows: o.show, ibShows: o.ibShow, obShows: o.obShow,
    bookingRate: d(o.sets,o.calls90s), ibBookingRate: d(o.ibSets,o.ibCalls90s), obBookingRate: d(o.obSets,o.obCalls90s),
    revenue: o.revenue, ibRevenue: o.ibRevenue, obRevenue: o.obRevenue, closedDeal: o.closedDeal,

// against 1,539 in the live sheet). Mirrors trendForRange()'s company-wide cascade but scoped by

function blankRawSums(){
  return {sets:0,ibSets:0,obSets:0,appt:0,ibAppt:0,obAppt:0,warmSet:0,ibWarmSet:0,obWarmSet:0,
    show:0,ibShow:0,obShow:0,calls90s:0,ibCalls90s:0,obCalls90s:0,revenue:0,ibRevenue:0,obRevenue:0,
    closedDeal:0,ibCalls:0,obCalls:0};

function addRawRow(o, r){
  const [,,,,sets,ibSets,obSets,appt,ibAppt,obAppt,warmSet,ibWarmSet,obWarmSet,
    show,ibShow,obShow,calls90s,ibCalls90s,obCalls90s,revenue,ibRevenue,obRevenue,closedDeal,

  o.sets+=sets; o.ibSets+=ibSets; o.obSets+=obSets; o.appt+=appt; o.ibAppt+=ibAppt; o.obAppt+=obAppt;
  o.warmSet+=warmSet; o.ibWarmSet+=ibWarmSet; o.obWarmSet+=obWarmSet;

  o.calls90s+=calls90s; o.ibCalls90s+=ibCalls90s; o.obCalls90s+=obCalls90s;
  o.revenue+=revenue; o.ibRevenue+=ibRevenue; o.obRevenue+=obRevenue; o.closedDeal+=closedDeal;
  o.ibCalls+=ibCalls; o.obCalls+=obCalls;
}
function weekBeginningOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');

  return dstr(d);
}
// `team` accepts a single team name (renderASRTrend's per-team loop reports on one team at a
// time), an array of names (state.team, now multi-select), or '' / [] to mean "no team
// restriction" (lob-only scoping, used by trendForRange()'s scoped branch when only the LOB
// filter is active). LOB matching goes through matchesLobFilter() (reads state.lob ambiently)
// rather than a hardcoded 'ASR' check, so this works for Internal Setter and any other LOB too.
function teamRawAggBy(team, keyFn){
  const teamList = Array.isArray(team) ? team : (team ? [team] : []);
  const map = new Map();
  for(const r of RAW_SCHED){
    if((teamList.length && !teamList.includes(r[1])) || !matchesLobFilter(r[2])) continue;
    const key = keyFn(r[3]);
    if(!map.has(key)) map.set(key, blankRawSums());
    addRawRow(map.get(key), r);
  }
  return map;
}

// Excel/Sheets QUARTILE.INC (linear interpolation, "R-7" method) on an ascending-sorted array.
function quartileInc(sortedAsc, q){
  if(!sortedAsc.length) return 0;
  const pos = (sortedAsc.length - 1) * (q/4);
  const base = Math.floor(pos), rest = pos - base;
  return sortedAsc[base+1]!==undefined ? sortedAsc[base] + rest*(sortedAsc[base+1]-sortedAsc[base]) : sortedAsc[base];
}

// Replicates the sheet's own "BR % per Call Source" pivot: Strong-Weak BR% (IB strong at >=35%,
// OB strong at >=45%) and OB BR Rating (quartile letter grade A-D on OB Booking Rate). Quartiles
// are computed across whichever rows are currently displayed (so a Team/Agent-filtered view ranks
// within that filtered set), matching the sheet's formulas: S5 = IF(L>=35%,"Strong IB","Weak IB")
// & " - " & IF(O>=45%,"Strong OB","Weak OB"); T5 = QUARTILE-based bucket on O (OB Booking %).
function addCallSourceRatings(rows){
  const obRates = rows.map(r=>r.obBookingRate).sort((a,b)=>a-b);
  const q1 = quartileInc(obRates,1), q2 = quartileInc(obRates,2), q3 = quartileInc(obRates,3);
  return rows.map(r => ({
    ...r,
    strongWeakBR: (r.ibBookingRate>=35?'Strong IB':'Weak IB') + ' - ' + (r.obBookingRate>=45?'Strong OB':'Weak OB'),
    obBRRating: r.obBookingRate>=q3?'A':r.obBookingRate>=q2?'B':r.obBookingRate>=q1?'C':'D',
  }));
}

function sum(arr, key){ return arr.reduce((s,r)=>s+(r[key]||0),0); }
function avg(arr, key){ return arr.length? sum(arr,key)/arr.length : 0; }

// Single shared floating tooltip, reused by every chart (line/column/bar) -- hovering anywhere
// near a data point shows ALL series' values together (e.g. Total/IB/OB at once), rather than
// relying on the browser's native single-value <title> tooltip (which also only fires when the
// cursor is exactly over one small element, not "anywhere near" that period).
function chartTooltipEl(){
  let el = document.getElementById('chartTooltip');
  if(!el){
    el = document.createElement('div');
    el.id = 'chartTooltip';
    el.className = 'chart-tooltip';
    document.body.appendChild(el);
  }
  return el;
}
function hideChartTooltip(){
  const el = document.getElementById('chartTooltip');
  if(el) el.style.display = 'none';
}
function showChartTooltip(clientX, clientY, title, lines){
  const el = chartTooltipEl();
  el.innerHTML = `<div class="ct-title">${title}</div>` + lines.map(l=>
    `<div class="ct-row">${l.color?`<span class="ct-dot" style="background:${l.color}"></span>`:''}${l.name}: <b>${l.value}</b></div>`
  ).join('');
  el.style.display = 'block';
  el.style.left = (clientX+14)+'px';
  el.style.top = (clientY+14)+'px';
  requestAnimationFrame(()=>{
    const r = el.getBoundingClientRect();
    if(r.right > window.innerWidth) el.style.left = (clientX - r.width - 14) + 'px';
    if(r.bottom > window.innerHeight) el.style.top = (clientY - r.height - 14) + 'px';
  });
}

// ---------------- SVG line chart ----------------
// opts.showValues: 'all' prints every point's value (fine for <=6-ish points), 'last' prints just
// the most recent point per series (keeps a many-point chart like a 30-day daily readable instead
// of stacking a number over every single point).
function lineChart(containerId, rows, series, xLabelFn, opts){
  opts = opts || {};
  const el = document.getElementById(containerId);
  if(!rows.length){ el.innerHTML = '<div class="no-data">No data in this range</div>'; return; }
  const W = el.clientWidth || 760, H = 220, padL=46, padR=16, padT=24, padB=28;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const n = rows.length;
  const xStep = n>1 ? plotW/(n-1) : 0;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible">`;

  // gridlines
  const maxVal = Math.max(...series.map(s=>Math.max(...rows.map(r=>r[s.key]||0)))) || 1;
  const niceMax = maxVal * 1.15;
  // Gridline labels must use the series' own formatter (fmtPct for a % metric, fmtMoney for
  // revenue, ...) instead of always fmtInt -- a Booking Rate axis printing "81" instead of "81%"
  // is misleading, not just unpolished.
  const gridFmt = series[0].fmt || fmtInt;
  for(let g=0; g<=4; g++){
    const y = padT + plotH - (g/4)*plotH;
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#383835" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+3}" font-size="9" fill="#898781" text-anchor="end">${gridFmt(niceMax*g/4)}</text>`;
  }
  // x labels (sparse)
  rows.forEach((r,i)=>{
    if(n<=10 || i%Math.ceil(n/8)===0 || i===n-1){
      const x = padL + i*xStep;
      svg += `<text x="${x}" y="${H-8}" font-size="9" fill="#898781" text-anchor="middle">${xLabelFn(r)}</text>`;
    }
  });

  series.forEach((s,si)=>{
    const color = s.color;
    let pts = rows.map((r,i)=>{
      const x = padL + i*xStep;
      const y = padT + plotH - ((r[s.key]||0)/niceMax)*plotH;
      return [x,y];
    });
    const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    svg += `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>{
      const val = rows[i][s.key]||0;
      const fmtVal = s.fmt ? s.fmt(val) : fmtInt(val);
      svg += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${color}" stroke="#1D1A1A" stroke-width="1">`;
      svg += `<title>${xLabelFn(rows[i])} · ${s.name}: ${fmtVal}</title></circle>`;
      if(opts.showValues==='all' || (opts.showValues==='last' && i===pts.length-1)){
        svg += `<text x="${p[0].toFixed(1)}" y="${(p[1]-8).toFixed(1)}" font-size="8" fill="${color}" text-anchor="middle">${fmtVal}</text>`;
      }
    });
  });
  svg += `<line class="crosshair" x1="0" y1="${padT}" x2="0" y2="${padT+plotH}" stroke="#898781" stroke-width="1" stroke-dasharray="3,3" style="display:none"/>`;
  svg += `</svg>`;
  el.innerHTML = svg;

  // Combined hover tooltip + crosshair: snap to the nearest period (not just exact-pixel-over-a-
  // circle) and show every series' value for it at once.
  const crosshair = el.querySelector('.crosshair');
  el.onmousemove = (ev) => {
    const rect = el.getBoundingClientRect();
    const scaleX = W / rect.width;
    const mouseX = (ev.clientX - rect.left) * scaleX;
    let idx = n>1 ? Math.round((mouseX - padL) / xStep) : 0;
    idx = Math.max(0, Math.min(n-1, idx));
    const row = rows[idx];
    const lines = series.map(s => ({name:s.name, color:s.color, value: s.fmt ? s.fmt(row[s.key]||0) : fmtInt(row[s.key]||0)}));
    showChartTooltip(ev.clientX, ev.clientY, xLabelFn(row), lines);
    if(crosshair){
      const x = padL + idx*xStep;
      crosshair.setAttribute('x1', x); crosshair.setAttribute('x2', x);
      crosshair.style.display = 'block';
    }
  };
  el.onmouseleave = () => { hideChartTooltip(); if(crosshair) crosshair.style.display='none'; };
}

function barChart(containerId, rows, key, nameFn, color, fmt){
  const el = document.getElementById(containerId);
  if(!rows.length){ el.innerHTML = '<div class="no-data">No data</div>'; return; }
  const W = el.clientWidth || 760;
  const rowH = 22, gap=6, padL=140, padR=60, padT=6;
  const H = rows.length*(rowH+gap)+padT;
  const maxVal = Math.max(...rows.map(r=>r[key]||0)) || 1;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">`;
  rows.forEach((r,i)=>{
    const y = padT + i*(rowH+gap);
    const w = ((r[key]||0)/maxVal) * (W-padL-padR);
    svg += `<text x="${padL-8}" y="${y+rowH*0.68}" font-size="11" fill="#c3c2b7" text-anchor="end">${nameFn(r)}</text>`;
    svg += `<rect x="${padL}" y="${y}" width="${Math.max(w,2)}" height="${rowH}" rx="4" fill="${color}">
              <title>${nameFn(r)}: ${fmt?fmt(r[key]):fmtInt(r[key])}</title></rect>`;
    svg += `<text x="${padL+w+8}" y="${y+rowH*0.68}" font-size="11" fill="#ffffff">${fmt?fmt(r[key]):fmtInt(r[key])}</text>`;
  });
  svg += `</svg>`;
  el.innerHTML = svg;
  el.onmousemove = (ev) => {
    const rect = el.getBoundingClientRect();
    const scaleY = H / rect.height;
    const mouseY = (ev.clientY - rect.top) * scaleY;
    let idx = Math.floor((mouseY - padT) / (rowH+gap));
    idx = Math.max(0, Math.min(rows.length-1, idx));
    const row = rows[idx];
    const val = row[key]||0;
    showChartTooltip(ev.clientX, ev.clientY, nameFn(row), [{name:'Value', color, value: fmt?fmt(val):fmtInt(val)}]);
  };
  el.onmouseleave = hideChartTooltip;
}

// Vertical column chart -- one group per period (e.g. month). Used for the Monthly view of
// Executive Summary Trend's per-metric chart trio: with only 3 periods, discrete columns read as
// a clearer comparison than a 3-point line.
// opts.stacked: series segments stack bottom-to-top instead of sitting side-by-side -- only valid
// for additive measures where the segments actually sum to something meaningful (e.g. IB Sets +
// OB Sets = Total Sets). Never stack ratio/percentage series -- IB% + OB% stacked would visually
// claim they sum to a "total" that isn't real.
// opts.showValues: prints each bar's (or, when stacked, each full stack's) value above it.
function groupedColumnChart(containerId, rows, series, xLabelFn, opts){
  opts = opts || {};
  const el = document.getElementById(containerId);
  if(!rows.length){ el.innerHTML = '<div class="no-data">No data in this range</div>'; return; }
  const W = el.clientWidth || 760, H = 220, padL=46, padR=16, padT=24, padB=28;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const n = rows.length;
  const groupW = plotW/n;

  if(opts.stacked){
    const barW = Math.max(16, groupW*0.45);
    const totals = rows.map(r => series.reduce((sum,s)=>sum+(r[s.key]||0), 0));
    const maxVal = Math.max(...totals) || 1;
    const niceMax = maxVal * 1.15;
    const gridFmt = opts.totalFmt || series[0].fmt || fmtInt;
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible">`;
    for(let g=0; g<=4; g++){
      const y = padT + plotH - (g/4)*plotH;
      svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#383835" stroke-width="1"/>`;
      svg += `<text x="${padL-8}" y="${y+3}" font-size="9" fill="#898781" text-anchor="end">${gridFmt(niceMax*g/4)}</text>`;
    }
    rows.forEach((r,i)=>{
      const groupX = padL + i*groupW;
      const barX = groupX + (groupW-barW)/2;
      svg += `<text x="${groupX+groupW/2}" y="${H-8}" font-size="9" fill="#898781" text-anchor="middle">${xLabelFn(r)}</text>`;
      let yCursor = padT + plotH;
      series.forEach(s=>{
        const val = r[s.key]||0;
        const segH = (val/niceMax)*plotH;
        yCursor -= segH;
        svg += `<rect x="${barX.toFixed(1)}" y="${yCursor.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(segH,0).toFixed(1)}" fill="${s.color}"><title>${xLabelFn(r)} · ${s.name}: ${s.fmt?s.fmt(val):fmtInt(val)}</title></rect>`;
      });
      if(opts.showValues){
        const total = totals[i];
        const topY = padT + plotH - (total/niceMax)*plotH;
        const fmtTotal = opts.totalFmt ? opts.totalFmt(total) : fmtInt(total);
        svg += `<text x="${groupX+groupW/2}" y="${(topY-6).toFixed(1)}" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">${fmtTotal}</text>`;
      }
    });
    svg += `</svg>`;
    el.innerHTML = svg;
    el.onmousemove = (ev) => {
      const rect = el.getBoundingClientRect();
      const scaleX = W / rect.width;
      const mouseX = (ev.clientX - rect.left) * scaleX;
      let idx = Math.floor((mouseX - padL) / groupW);
      idx = Math.max(0, Math.min(rows.length-1, idx));
      const row = rows[idx];
      const totalFmtFn = opts.totalFmt || fmtInt;
      const lines = [
        {name:'Total', color:'#ffffff', value: totalFmtFn(totals[idx])},
        ...series.map(s => ({name:s.name, color:s.color, value: s.fmt ? s.fmt(row[s.key]||0) : fmtInt(row[s.key]||0)})),
      ];
      showChartTooltip(ev.clientX, ev.clientY, xLabelFn(row), lines);
    };
    el.onmouseleave = hideChartTooltip;
    return;
  }

  const barGap = 4;
  const barW = Math.max(6, (groupW - barGap*(series.length+1)) / series.length);
  const maxVal = Math.max(...series.map(s=>Math.max(...rows.map(r=>r[s.key]||0)))) || 1;
  const niceMax = maxVal * 1.15;
  const gridFmt = series[0].fmt || fmtInt;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible">`;
  for(let g=0; g<=4; g++){
    const y = padT + plotH - (g/4)*plotH;
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#383835" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+3}" font-size="9" fill="#898781" text-anchor="end">${gridFmt(niceMax*g/4)}</text>`;
  }
  rows.forEach((r,i)=>{
    const groupX = padL + i*groupW;
    svg += `<text x="${groupX+groupW/2}" y="${H-8}" font-size="9" fill="#898781" text-anchor="middle">${xLabelFn(r)}</text>`;
    series.forEach((s,si)=>{
      const x = groupX + barGap + si*(barW+barGap);
      const val = r[s.key]||0;
      const barH = (val/niceMax)*plotH;
      const y = padT + plotH - barH;
      const fmtVal = s.fmt?s.fmt(val):fmtInt(val);
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH,0).toFixed(1)}" rx="2" fill="${s.color}"><title>${xLabelFn(r)} · ${s.name}: ${fmtVal}</title></rect>`;
      if(opts.showValues){
        svg += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="7.5" fill="#c3c2b7" text-anchor="middle">${fmtVal}</text>`;
      }
    });
  });
  svg += `</svg>`;
  el.innerHTML = svg;
  el.onmousemove = (ev) => {
    const rect = el.getBoundingClientRect();
    const scaleX = W / rect.width;
    const mouseX = (ev.clientX - rect.left) * scaleX;
    let idx = Math.floor((mouseX - padL) / groupW);
    idx = Math.max(0, Math.min(rows.length-1, idx));
    const row = rows[idx];
    const lines = series.map(s => ({name:s.name, color:s.color, value: s.fmt ? s.fmt(row[s.key]||0) : fmtInt(row[s.key]||0)}));
    showChartTooltip(ev.clientX, ev.clientY, xLabelFn(row), lines);
  };
  el.onmouseleave = hideChartTooltip;
}

// ---------------- sortable table ----------------
function renderTable(tableId, rows, cols, opts){
  opts = opts || {};
  const tbody = document.getElementById(tableId+'-body');
  const thead = document.getElementById(tableId+'-head');
  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="${cols.length}" class="no-data">No rows match the current filters</td></tr>`; }
  const st = sortState[tableId];
  let sorted = rows.slice();
  if(st){
    sorted.sort((a,b)=>{
      const va=a[st.col], vb=b[st.col];
      if(typeof va==='string') return st.dir*va.localeCompare(vb);
      return st.dir*((va||0)-(vb||0));
    });
  }
  thead.innerHTML = '<tr>' + cols.map(c=>`<th data-col="${c.key}" class="${(st&&st.col===c.key?'sorted ':'')}${c.sticky?'sticky-col':''}">${c.label}</th>`).join('') + '</tr>';
  thead.querySelectorAll('th').forEach(th=>{
    th.addEventListener('click', ()=>{
      const col = th.dataset.col;
      const cur = sortState[tableId];
      sortState[tableId] = { col, dir: (cur && cur.col===col) ? -cur.dir : -1 };
      renderTable(tableId, rows, cols, opts);
    });
  });
  tbody.innerHTML = sorted.map(r=>{
    const cls = opts.rowClass ? opts.rowClass(r) : '';
    return `<tr class="${cls}">` + cols.map(c=> `<td${c.sticky?' class="sticky-col"':''}>${c.fmt ? c.fmt(r[c.key], r) : (r[c.key] ?? '')}</td>`).join('') + '</tr>';
  }).join('');

  // Frozen columns: left-offset uses each column's declared `width` (c.width, default 130px),
  // NOT a measured getBoundingClientRect() -- this dashboard pre-renders every tab's table while
  // only one tab is visible (the rest sit under display:none), and a hidden element's
  // getBoundingClientRect() always reports 0 width, which previously collapsed every sticky
  // column to the same left:0 and made only the last one visible. Fixing the width explicitly
  // (instead of auto-sizing to content) sidesteps that entirely.
  const stickyIdxs = cols.map((c,i)=>c.sticky?i:-1).filter(i=>i>=0);
  if(stickyIdxs.length){
    const headCells = thead.querySelectorAll('th');
    const bodyRows = tbody.querySelectorAll('tr');
    let leftAcc = 0;
    stickyIdxs.forEach(colIdx => {
      const c = cols[colIdx];
      const w = c.width || 130;
      const th = headCells[colIdx];
      if(th){ th.style.left = leftAcc+'px'; th.style.width = w+'px'; th.style.minWidth = w+'px'; th.style.maxWidth = w+'px'; }
      bodyRows.forEach(tr => {
        const td = tr.children[colIdx];
        if(td){ td.style.left = leftAcc+'px'; td.style.width = w+'px'; td.style.minWidth = w+'px'; td.style.maxWidth = w+'px'; }
      });
      leftAcc += w;
    });
  }
}

// ---------------- panel builders ----------------
function kpiTile(label, value, sub){
  return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div>${sub?`<div class="metric-sub">${sub}</div>`:''}</div>`;
}

// Same-length period immediately preceding [start,end] -- e.g. Sep 11-20 (10 days) -> Sep 1-10,
// not necessarily the previous calendar month/week. Used for KPI tiles' "vs prev period" delta.
function prevPeriodRange(start, end){
  const spanDays = Math.round((new Date(end+'T00:00:00') - new Date(start+'T00:00:00'))/86400000) + 1;
  const prevEnd = addDaysStr(start, -1);
  const prevStart = addDaysStr(prevEnd, -(spanDays-1));
  return {prevStart, prevEnd};
}
// Renders a kpiTile `sub` showing the prior period's value and a colored up/down % change.
function deltaSub(curr, prev, fmt){
  fmt = fmt || fmtInt;
  if(!prev) return curr ? `<span style="color:var(--gray)">no prior-period data</span>` : '';
  const pct = (curr-prev)/prev*100;
  const up = pct >= 0;
  const color = up ? 'var(--s-aqua)' : 'var(--s-orange)';
  return `<span style="color:${color}">${up?'▲':'▼'} ${Math.abs(pct).toFixed(1)}%</span> vs prev period (${fmt(prev)})`;
}

function buildPanels(){
  const wrap = document.getElementById('panels');
  wrap.innerHTML = TABS.map((t,i)=>`<div class="tab-content${i===0?' active':''}" id="panel-${i}"></div>`).join('');
}

function buildMainTabBar(){
  const bar = document.getElementById('mainTabBar');
  bar.innerHTML = MAIN_TABS.map((m,i)=>`<button class="main-tab ${i===activeMainTab?'active':''}" data-i="${i}">${m.name}</button>`).join('');
  bar.querySelectorAll('.main-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = Number(btn.dataset.i);
      if(i === activeMainTab) return;
      activeMainTab = i;
      bar.querySelectorAll('.main-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      buildTabBar();
      // Switching SETTER/CLOSER is a bigger pivot than just changing the LOB filter -- reset
      // Team/Agent too so a selection from the other main tab's context doesn't linger (e.g. a
      // Closer team staying selected after switching to SETTER). rebuildLobOptions() clears
      // state.lob itself if it's no longer one of this main tab's allowed values.
      state.team = []; state.agent = [];
      rebuildLobOptions(); refreshTeamFilterUI(); refreshAgentFilterUI();
      renderAll();
    });
  });
}

// Renders the sub-tab bar for whichever MAIN_TABS group is active, and switches the visible
// panel to that group's first tab (called both on initial load and whenever the SETTER/CLOSER
// main tab changes).
function buildTabBar(){
  const bar = document.getElementById('tabBar');
  const indices = MAIN_TABS[activeMainTab].tabIndices;
  bar.innerHTML = indices.map((i,pos)=>`<button class="tab ${pos===0?'active':''}" data-i="${i}">${TABS[i]}</button>`).join('');
  bar.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      bar.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(p=>p.classList.remove('active'));
      document.getElementById('panel-'+btn.dataset.i).classList.add('active');
    });
  });
  document.querySelectorAll('.tab-content').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+indices[0]).classList.add('active');
}

// 1. Executive Summary Trend
// The 11 KPI tiles shown on Executive Summary Trend -- factored out so ASR Daily Metric can show
// the identical set (same formulas, same live "vs prev period" comparison) without duplicating
// ~20 lines of near-identical markup/logic twice.
function execKpiTilesHtml(t){
  const rows = t.rows;
  const {prevStart, prevEnd} = prevPeriodRange(state.start, state.end);
  const prevT = execCompanyTotals(prevStart, prevEnd);
  const curSets = sum(rows,'sets'), curAppt = sum(rows,'appt'), curWarmT = avg(rows,'warmT'),
    curShows = sum(rows,'shows'), curShowRate = avg(rows,'showRate'), curBookingRate = avg(rows,'bookingRate'),
    curRevenue = sum(rows,'revenue'), curClosedDeal = sum(rows,'closedDeal'),
    curAov = curClosedDeal ? curRevenue/curClosedDeal : 0,
    curCalls90s = sum(rows,'calls90s'), curConnectRate = avg(rows,'connectRate');
  const prevNote = ` vs prev period (${prevStart} → ${prevEnd})`;
  return `
    <div class="metrics-container">
      ${kpiTile('Sets', fmtInt(curSets), `IB ${fmtInt(sum(rows,'ibSets'))} · OB ${fmtInt(sum(rows,'obSets'))}<br>${deltaSub(curSets, prevT.sets)}`)}
      ${kpiTile('Appointments', fmtInt(curAppt), deltaSub(curAppt, prevT.appt))}
      ${kpiTile('Warm Transfer %', fmtPct(curWarmT), `IB ${fmtPct(avg(rows,'ibWarmT'))} · OB ${fmtPct(avg(rows,'obWarmT'))}<br>${deltaSub(curWarmT, prevT.warmT, fmtPct)}`)}
      ${kpiTile('Shows', fmtInt(curShows), `IB ${fmtInt(sum(rows,'ibShows'))} · OB ${fmtInt(sum(rows,'obShows'))}<br>${deltaSub(curShows, prevT.shows)}`)}
      ${kpiTile('Show Rate %', fmtPct(curShowRate), `IB ${fmtPct(avg(rows,'ibShowRate'))} · OB ${fmtPct(avg(rows,'obShowRate'))}<br>${deltaSub(curShowRate, prevT.showRate, fmtPct)}`)}
      ${kpiTile('Booking Rate %', fmtPct(curBookingRate), `IB ${fmtPct(avg(rows,'ibBookingRate'))} · OB ${fmtPct(avg(rows,'obBookingRate'))}<br>${deltaSub(curBookingRate, prevT.bookingRate, fmtPct)}`)}
      ${kpiTile('Upfront Revenue', fmtMoney(curRevenue), `IB ${fmtMoney(sum(rows,'ibRevenue'))} · OB ${fmtMoney(sum(rows,'obRevenue'))}<br>${deltaSub(curRevenue, prevT.revenue, fmtMoney)}`)}
      ${kpiTile('Closed Deal', fmtInt(curClosedDeal), deltaSub(curClosedDeal, prevT.closedDeal))}
      ${kpiTile('AOV', fmtMoney(curAov), deltaSub(curAov, prevT.closedDeal?prevT.revenue/prevT.closedDeal:0, fmtMoney))}
      ${kpiTile('90 sec Calls', fmtInt(curCalls90s), `IB ${fmtInt(sum(rows,'ibCalls90s'))} · OB ${fmtInt(sum(rows,'obCalls90s'))}<br>${deltaSub(curCalls90s, prevT.calls90s)}`)}
      ${kpiTile('Connect Rate', fmtPct(curConnectRate), deltaSub(curConnectRate, prevT.connectRate, fmtPct))}
    </div>
    <div class="note">Tiles compare the selected period${prevNote}, computed live from Sched.</div>
  `;
}

  const execMonthly = execChartMonthlyRows().slice(-3);
  const execWeekly = execChartWeeklyRows().slice(-6);
  const execDaily = execChartDailyRows().slice(-EXEC_CHART_DAILY_N);
  const monthLbl = r => r.month.slice(5)+'/'+r.month.slice(2,4);
  const weekLbl = r => 'WB '+r.weekBeginning.slice(5);
  const dayLbl = r => r.date.slice(5);
  EXEC_CHART_METRICS.forEach(m => {
    const series = execMetricSeries(m.key, m.fmt);
    if(m.stacked){
      const cap = m.key[0].toUpperCase()+m.key.slice(1);
      const stackSeries = [
        {key:'ib'+cap, name:'IB', color:getVar('--s-blue'), fmt:m.fmt},
        {key:'ob'+cap, name:'OB', color:getVar('--s-aqua'), fmt:m.fmt},
      ];
      groupedColumnChart(`chart-exec-${m.id}-m`, execMonthly, stackSeries, monthLbl, {stacked:true, showValues:true, totalFmt:m.fmt});
    } else {
      groupedColumnChart(`chart-exec-${m.id}-m`, execMonthly, series, monthLbl, {showValues:true});
    }
    lineChart(`chart-exec-${m.id}-w`, execWeekly, series, weekLbl, {showValues:'all'});
    lineChart(`chart-exec-${m.id}-d`, execDaily, series, dayLbl, {showValues:'last'});
  });
  const cols = fullMetricCols('period', 'Date');
  const withPeriod = execDaily.map(r=>({...r, period: r.date}));
  renderTable('tbl-exec', withPeriod, cols);
}

function getVar(name){ return getComputedStyle(document.body).getPropertyValue(name).trim() || name; }

// 2. ASR Trend View — real per-team monthly rollup from the sheet's own Executive Summary Trend team blocks
const ASR_TREND_TEAM_COLORS = ['--s-blue','--s-orange','--s-aqua','--s-yellow','--s-magenta','--s-violet'];
function renderASRTrend(t){
  const p = document.getElementById('panel-1');
  const teamsToShow = isCloserLob(state.lob) ? [] : (state.team.length ? state.team : ALL_TEAMS);
  // Live per-team Monthly, computed from RAW_SCHED (see teamMonthlyRowsFor) instead of the static
  // TEAM_MONTHLY snapshot -- that snapshot was only ever captured once early in this dashboard's
  // build and drifted from reality, and only ever covered the original 3 ASR teams.
  const teamMonthlyLive = {};
  teamsToShow.forEach(team => { teamMonthlyLive[team] = teamMonthlyRowsFor(team); });
  const allMonths = Array.from(new Set(teamsToShow.flatMap(team => teamMonthlyLive[team].map(r=>r.month)))).sort();
  let teamMonthRows = teamsToShow.flatMap(team => teamMonthlyLive[team].map(r=>({...r, month: team+' — '+r.month})));
  const wanted = teamsToShow.flatMap(team => teamMonthlyLive[team]
    .filter(r => r.month >= state.start.slice(0,7) && r.month <= state.end.slice(0,7))
    .map(r=>({...r, month: team+' — '+r.month})));
  if(wanted.length) teamMonthRows = wanted;

  const latestMonth = allMonths.length ? allMonths[allMonths.length-1] : ASOF.slice(0,7);

  // KPI tiles and the per-team bar chart now follow the selected date range exactly -- summed
  // straight from RAW_SCHED (same approach as Rep per Metric / Executive Summary Trend) -- instead
  // of always showing the latest calendar month regardless of what's picked in the date filter.
  // The "Team monthly detail" table and trend line chart below stay monthly (they're explicitly
  // labeled as such), same as how Executive Summary Trend's charts always show a fuller window
  // than the exact selection.
  const rangeSums = blankRawSums();
  RAW_SCHED.filter(r => teamsToShow.includes(r[1]) && matchesLobFilter(r[2]) && inRange(r[3])).forEach(r => addRawRow(rangeSums, r));
  const rangeAgg = repMetrics26(rangeSums);
  const teamDailyMaxes = teamsToShow.map(team => { const d = teamDailyRowsFor(team); return d.length ? d[d.length-1].date : null; }).filter(Boolean);
  const teamsMaxDate = teamDailyMaxes.length ? teamDailyMaxes.reduce((a,b)=>a>b?a:b) : null;
  const noDataYet = teamsToShow.length>0 && teamsMaxDate && state.start > teamsMaxDate;

  const scopeBanner = isCloserLob(state.lob)
    ? `<div class="scope-banner blocked">⚠ LOB is set to Closer, but this is the ASR team trend — switch LOB to ASR or All to see it.</div>`
    : (noDataYet
        ? `<div class="scope-banner blocked">⚠ No data yet for this range — Sched's latest posted day for the selected team(s) is <b>${teamsMaxDate}</b>. The tiles below are showing 0, not a different period's totals.</div>`
        : (state.agent.length ? `<div class="scope-banner">The Agent filter (<b>${agentLabel()}</b>) doesn't narrow this team trend — see Rep per Metric for that person's own totals.</div>` : ''));

  p.innerHTML = `
    ${scopeBanner}
    <div class="metrics-container">
      ${kpiTile(`Sets (${state.start} → ${state.end}, selected teams)`, fmtInt(rangeAgg.sets), `IB ${fmtInt(rangeAgg.ibSets)} · OB ${fmtInt(rangeAgg.obSets)}`)}
      ${kpiTile('Warm Transfer %', fmtPct(rangeAgg.warmT))}
      ${kpiTile('Shows', fmtInt(rangeAgg.shows))}
      ${kpiTile('Booking Rate %', fmtPct(rangeAgg.bookingRate))}
      ${kpiTile('Upfront Revenue', fmtMoney(rangeAgg.revenue))}
      ${kpiTile('Closed Deal', fmtInt(rangeAgg.closedDeal))}
    </div>
    <div class="chart-card">
      <h3>Sets by team — ${allMonths.join(' / ')}</h3>
      <div class="legend">${teamsToShow.map((tm,i)=>`<span><i style="background:${getVar(ASR_TREND_TEAM_COLORS[i%ASR_TREND_TEAM_COLORS.length])}"></i>${tm}</span>`).join('')}</div>
      <div id="chart-asr-teamlines"></div>
    </div>
    <div class="chart-card">
      <h3>Sets by team (${state.start} → ${state.end}, IB vs OB)</h3>
      <div id="chart-asr-teambar"></div>
    </div>
    <div class="section-title">Team monthly detail — all metrics, as shown on the sheet</div>
    <div class="note">Computed live from Sched's per-rep-per-day records for each team (periodically refreshed, covers ${RAW_SCHED_MIN_DATE} → ${RAW_SCHED_MAX_DATE}; the most recent ~week can still revise as Sched backfills -- treat it as provisional), same Daily/Weekly/Monthly source as Executive Summary Trend, not a fixed snapshot.</div>
    <div class="table-section"><table><thead id="tbl-asrteam-head"></thead><tbody id="tbl-asrteam-body"></tbody></table></div>
  `;
  // team lines chart: one line per team, using 'month' as x -- always the fuller monthly trend,
  // not range-filtered (same rationale as Executive Summary Trend's charts).
  const monthLabel = r => r.month.slice(5)+'/'+r.month.slice(2,4);
  const series = teamsToShow.map((team,i)=>({key:'__t'+i, name:team, color: getVar(ASR_TREND_TEAM_COLORS[i%ASR_TREND_TEAM_COLORS.length])}));
  const merged = allMonths.map(month=>{
    const o = {month};
    teamsToShow.forEach((team,i)=>{ const tr = teamMonthlyLive[team].find(r=>r.month===month); o['__t'+i] = tr?tr.sets:0; });
    return o;
  });
  lineChart('chart-asr-teamlines', merged, series, monthLabel);
  const rangeRowsByTeam = teamsToShow.map(team=>{
    const sums = blankRawSums();
    RAW_SCHED.filter(r=>r[1]===team && matchesLobFilter(r[2]) && inRange(r[3])).forEach(r=>addRawRow(sums,r));
    return {...repMetrics26(sums), team};
  });
  barChart('chart-asr-teambar', rangeRowsByTeam, 'sets', r=>r.team, getVar('--s-orange'));
  renderTable('tbl-asrteam', teamMonthRows, fullMetricCols('month', 'Team — Month'));
}

// 3. CLOSER Trend View — real company-wide closer trend (mirrors Executive Summary Trend's depth)
function renderCloserTrend(){
  const p = document.getElementById('panel-5');

  const rows = ct.rows;
  const lobBlocked = SETTER_LOBS.includes(state.lob);
  const scopeBanner = lobBlocked

  // Tiles are live off RAW_SCHED (respect Date Range / Team / Agent, with a real "vs prev period"
  // comparison) -- unlike the charts/table further down, which still show the sheet's own captured
  // CLOSER Trend View snapshot (a different, narrower lookback window).
  const curr = lobBlocked ? null : closerCompanyTotals(state.start, state.end);

      ${kpiTile('Appointments', fmtInt(curr?.appt||0), curr?deltaSub(curr.appt, prev.appt):'')}
      ${kpiTile('Appts less Cancelled', fmtInt(curr?.apptsLessCancelled||0), curr?deltaSub(curr.apptsLessCancelled, prev.apptsLessCancelled):'')}

      ${kpiTile('AOV $', fmtMoney(curr?.aov||0), curr?deltaSub(curr.aov, prev.aov, fmtMoney):'')}
      ${kpiTile('RS1', fmtInt(curr?.rs1||0), curr?deltaSub(curr.rs1, prev.rs1):'')}
      ${kpiTile('Clubs', fmtInt(curr?.clubs||0), curr?deltaSub(curr.clubs, prev.clubs):'')}
      ${kpiTile('PG1', fmtInt(curr?.pg1||0), curr?deltaSub(curr.pg1, prev.pg1):'')}
    </div>
    <div class="note">Tiles: exact sums for ${state.start} → ${state.end} vs the equivalent prior period (${prevStart} → ${prevEnd}), computed live from Sched (covers ${RAW_SCHED_MIN_DATE} → ${RAW_SCHED_MAX_DATE}). Chart/table below show ${ct.gran} granularity from the sheet's own captured snapshot${ct.exactMonth ? ' — a whole-month selection, using the sheet\'s real Monthly figure directly.' : ' (Daily is a captured 10-day sample; wider or older ranges fall back to Weekly/Monthly, preferring the sheet\'s real Monthly total whenever the range is a full month).'}</div>
    <div class="section-title">Closer Show, Show Rate %, Closed Rate %, Upfront Revenue $, AOV $, RS1, Clubs, PG1 — Monthly / Weekly / Daily</div>
    <div class="note">These 24 charts are NOT affected by the Date Range filter above -- they always show the latest 3 months / 6 weeks / ${CLOSER_CHART_DAILY_N} days. Team and Agent filters do apply, same as the rest of this tab.</div>
    ${CLOSER_CHART_METRICS.map(m => `
    <div class="chart-row">
      <div class="chart-card">
        <h3>${m.label} — Monthly <span style="color:var(--gray); font-weight:400; text-transform:none; letter-spacing:0">(last 3 months)</span></h3>
        <div class="legend"><span><i style="background:var(--s-orange)"></i>${m.label}</span></div>
        <div id="chart-closer-${m.id}-m"></div>
      </div>
      <div class="chart-card">
        <h3>${m.label} — Weekly <span style="color:var(--gray); font-weight:400; text-transform:none; letter-spacing:0">(last 6 weeks)</span></h3>
        <div class="legend"><span><i style="background:var(--s-orange)"></i>${m.label}</span></div>
        <div id="chart-closer-${m.id}-w"></div>
      </div>
      <div class="chart-card">
        <h3>${m.label} — Daily <span style="color:var(--gray); font-weight:400; text-transform:none; letter-spacing:0">(last ${CLOSER_CHART_DAILY_N} days)</span></h3>
        <div class="legend"><span><i style="background:var(--s-orange)"></i>${m.label}</span></div>
        <div id="chart-closer-${m.id}-d"></div>
      </div>
    </div>`).join('')}
    <div class="section-title">Top closers by revenue (current snapshot)</div>
    <div class="note">Per-closer breakdown is the current-period snapshot from Closers Metric — the sheet's CLOSER Trend View also carries a full per-closer Monthly/Weekly/Daily block for each of the 23 closers individually; only the company-wide roll-up above is reproduced here.</div>
    <div class="chart-card"><div id="chart-closer-topbar"></div></div>
    <div class="section-title">Period detail — all 10 metrics, as shown on the sheet</div>
    <div class="table-section"><table><thead id="tbl-closertrend-head"></thead><tbody id="tbl-closertrend-body"></tbody></table></div>
  `;
  const closerMonthly = closerChartMonthlyRows().slice(-3);
  const closerWeekly = closerChartWeeklyRows().slice(-6);
  const closerDaily = closerChartDailyRows().slice(-CLOSER_CHART_DAILY_N);

  const withPeriod = rows.map(r=>({...r, period: ct.label(r)}));
  renderTable('tbl-closertrend', withPeriod, closerMetricCols('period', periodLabel));
}

// 7. BR % per Call Source
// Local slicers for this table only (not part of the global Date/LOB/Team/Agent filter bar) --
// persists across re-renders triggered by the global filters so the slicer stays selected while
// the user changes date range/team/agent, but doesn't leak into or get reset by them.
let brSlicerState = { strongWeak: '', obRating: '' };
function renderCallSourceBR(){
  const p = document.getElementById('panel-4');
  let rows = isCloserLob(state.lob) ? [] : callSourceRowsForRange();
  rows = rows.filter(r=>matchesTeamFilter(r.team) && matchesAgentFilter(r.name));
  rows = addCallSourceRatings(rows);

  // Slicer options come from whatever combos actually exist in the currently-scoped rows (before
  // the slicers themselves narrow further), so an option never points at an empty result.
  const strongWeakOptions = Array.from(new Set(rows.map(r=>r.strongWeakBR))).sort();
  const obRatingOptions = ['A','B','C','D'].filter(g => rows.some(r=>r.obBRRating===g));
  if(strongWeakOptions.length && !strongWeakOptions.includes(brSlicerState.strongWeak)) brSlicerState.strongWeak = '';
  if(obRatingOptions.length && !obRatingOptions.includes(brSlicerState.obRating)) brSlicerState.obRating = '';

  let filteredRows = rows;
  if(brSlicerState.strongWeak) filteredRows = filteredRows.filter(r=>r.strongWeakBR===brSlicerState.strongWeak);
  if(brSlicerState.obRating) filteredRows = filteredRows.filter(r=>r.obBRRating===brSlicerState.obRating);

  p.innerHTML = `
    <div class="section-title">Booking Rate % by IVR call source</div>
    <div class="note">Computed live from Sched's per-rep-per-day records (periodically refreshed from Sched, covers ${RAW_SCHED_MIN_DATE} → ${RAW_SCHED_MAX_DATE}; the most recent ~week can still revise as Sched backfills -- treat it as provisional) — follows Date Range / Team / Agent filters above (booking rate can exceed 100% when one rep books multiple appointments from fewer unique inbound calls in the source data). Strong-Weak BR% and OB BR Rating replicate the sheet's own pivot (IB strong at ≥35%, OB strong at ≥45%; OB BR Rating is a quartile grade A-D on OB Booking Rate, computed across whatever rows are currently shown here).</div>
    <div class="br-slicers" style="display:flex; gap:16px; margin:12px 0; flex-wrap:wrap;">
      <div class="filter-group">
        <label>Strong-Weak BR %</label>
        <select id="brSlicerStrongWeak">
          <option value="">All</option>
          ${strongWeakOptions.map(o=>`<option value="${o}" ${o===brSlicerState.strongWeak?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <label>OB BR Rating</label>
        <select id="brSlicerObRating">
          <option value="">All</option>
          ${obRatingOptions.map(g=>`<option value="${g}" ${g===brSlicerState.obRating?'selected':''}>${g}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="table-section"><table><thead id="tbl-br-head"></thead><tbody id="tbl-br-body"></tbody></table></div>
  `;
  document.getElementById('brSlicerStrongWeak').addEventListener('change', (ev)=>{
    brSlicerState.strongWeak = ev.target.value; renderCallSourceBR();
  });
  document.getElementById('brSlicerObRating').addEventListener('change', (ev)=>{
    brSlicerState.obRating = ev.target.value; renderCallSourceBR();
  });
  renderTable('tbl-br', filteredRows, [
    {key:'team', label:'Current Team', sticky:true, width:120}, {key:'name', label:'Name', sticky:true, width:170},
    {key:'ivr1Calls', label:'IVR1 Calls'}, {key:'ivr1BR', label:'IVR1 Booking %', fmt:fmtPct},
    {key:'ivr2Calls', label:'IVR2 Calls'}, {key:'ivr2BR', label:'IVR2 Booking %', fmt:fmtPct},
    {key:'ivr3Calls', label:'IVR3 Calls'}, {key:'ivr3BR', label:'IVR3 Booking %', fmt:fmtPct},
    {key:'ivr4Calls', label:'IVR4 Calls'}, {key:'ivr4BR', label:'IVR4 Booking %', fmt:fmtPct},
    {key:'ibCalls', label:'IB Calls'}, {key:'ibBookingRate', label:'IB Booking %', fmt:fmtPct}, {key:'ibConnectRate', label:'IB Connect %', fmt:fmtPct},
    {key:'obCalls', label:'OB Calls'}, {key:'obBookingRate', label:'OB Booking %', fmt:fmtPct}, {key:'obConnectRate', label:'OB Connect %', fmt:fmtPct},
    {key:'sets', label:'Sets'}, {key:'bookingRate', label:'Booking Rate', fmt:fmtPct},
    {key:'strongWeakBR', label:'Strong-Weak BR %'}, {key:'obBRRating', label:'OB BR Rating'},
  ]);
}
